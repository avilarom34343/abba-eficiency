    <template>
      <style>
        @font-face { font-family: 'Barlow'; font-weight: 400; src: url('assets/fonts/barlow-400.ttf') format('truetype'); }

        [data-composition-id="01-f1"] #stage {
          position: relative;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #111111;
          color: #f0ece5;

        }
        [data-composition-id="01-f1"] #stage * { box-sizing: border-box; margin: 0; padding: 0; }

        /* group containers: frame-local spans swapped with 0ms tl.set */
        .f1-group {
          position: absolute;
          inset: 0;
          padding: 0 90px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;

        #f1_g2, #f1_g3 { visibility: hidden; opacity: 0; }

        /* ---------- g1: year + cassette + wordmark ---------- */

          border-bottom-right-radius: 8px;
          transform-origin: 100% 100%;

      <div

            <defs>
              <symbol id="f1_g2_store" viewBox="0 0 24 24">

      <script>
        (function () {
          var root = document.querySelector('[data-composition-id="01-f1"]');
          var $ = function (s) { return root.querySelector(s); };
          var $$ = function (s) { return root.querySelectorAll(s); };
          var hash = function (i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
          var FPS = 30;
          var END = 7.55;
          var tl = gsap.timeline({ paused: true });

          // group cuts (0ms swaps) — anchors are frame-local == track seconds (frame starts at 0)
          var G1 = [0, 2.93], G2 = [2.93, 4.46], G3 = [4.46, END];
          tl.set("#f1_g1", { autoAlpha: 0 }, G1[1]);
          tl.set("#f1_g2", { autoAlpha: 1 }, G2[0]);
          tl.set("#f1_g2", { autoAlpha: 0 }, G2[1]);
          tl.set("#f1_g3", { autoAlpha: 1 }, G3[0]);

          /* ================= g1 ================= */
          // slow push on the whole group so the hold is never static
          tl.fromTo("#f1_g1_inner", { scale: 1 }, { scale: 1.045, duration: G1[1], ease: "none" }, 0);

          // slot-machine-reveal: "2000" — reels spin from t=0, start 0.05, land by 0.49 (before 0.51 hit)
          var year = $("#f1_g1_year");
          "2000".split("").forEach(function (target, i) {
            var n = 12, html = "";
            for (var k = 0; k < n - 1; k++) html += "<span>" + ((k * 7 + i * 3 + 1) % 10) + "</span>";
            html += "<span>" + target + "</span>";
            var win = document.createElement("span");
            win.className = "f1-reel-win";
            win.innerHTML = '<span class="f1-reel-strip">' + html + "</span>";
            year.appendChild(win);
            tl.fromTo(win.firstChild, { yPercent: 0 }, { yPercent: -((n - 1) / n) * 100, duration: 0.32 + i * 0.04, ease: "power3.out" }, 0.05);
          });
          // tiny settle pulse when the last reel lands
          tl.fromTo(year, { scale: 1 }, { scale: 1.06, duration: 0.07, ease: "power2.out" }, 0.49);
          tl.to(year, { scale: 1, duration: 0.25, ease: "power2.out" }, 0.56);
          tl.fromTo("#f1_g1_kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 0.05);

          // overlay-pop: cassette slides in from the right at 0.51
          tl.fromTo("#f1_g1_vhs", { x: 820, rotation: 10, opacity: 1 }, { x: 0, rotation: -2, duration: 0.42, ease: "back.out(1.4)" }, 0.51);
          tl.to("#f1_g1_vhs", { rotation: 1.5, y: -10, duration: G1[1] - 0.93, ease: "sine.inOut" }, 0.93);
          // spools keep turning through the hold
          tl.fromTo(["#f1_g1_spoolL", "#f1_g1_spoolR"], { rotation: 0, transformOrigin: "50% 50%" }, { rotation: -900, transformOrigin: "50% 50%", duration: G1[1] - 0.51, ease: "none" }, 0.51);

          // kinetic-letter-in: "blockbuster" at 1.39
          var word = $("#f1_g1_word");
          "blockbuster".split("").forEach(function (c) {
            var s = document.createElement("span");
            s.className = "f1-char";
            s.textContent = c;
            word.appendChild(s);
          });
          tl.fromTo($$("#f1_g1_word .f1-char"), { y: 80, opacity: 0 }, { y: 0, opacity: 1, stagger: 0.035, ease: "back.out(2)", duration: 0.45 }, 1.39);

          // overlay-pop: "dallas, texas" at 2.04
          tl.fromTo("#f1_g1_place", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(3)" }, 2.04);
          tl.fromTo("#f1_g1_place .f1-stub", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, 2.08);

          /* ================= g2 ================= */
          // color-grid-shuffle: store icons accumulate behind the stat
          var grid = $("#f1_g2_grid");
          var NS = "http://www.w3.org/2000/svg";
          var COLS = 15, ROWS = 27, CELL = 72, ICON = 44, icons = [];
          for (var r = 0; r < ROWS; r++) {
            for (var c = 0; c < COLS; c++) {
              var u = document.createElementNS(NS, "use");
              u.setAttribute("href", "#f1_g2_store");
              u.setAttribute("x", c * CELL + (CELL - ICON) / 2);
              u.setAttribute("y", r * CELL + (CELL - ICON) / 2);
              u.setAttribute("width", ICON);
              u.setAttribute("height", ICON);
              u.style.color = "#282826";
              grid.appendChild(u);
              icons.push(u);
            }
          }
          tl.fromTo(icons, { opacity: 0 }, {
            opacity: 1, duration: 0.12, ease: "none",
            stagger: function (i) { return hash(i) * 0.62; }
          }, G2[0]);
          tl.fromTo(grid, { scale: 1.08 }, { scale: 1, duration: G2[1] - G2[0], ease: "power1.out" }, G2[0]);
          // palette shuffle on the hits: a seeded share of icons flips orange
          [[3.11, 0.06], [3.6, 0.14], [3.69, 0.22]].forEach(function (hit, h) {
            icons.forEach(function (el, i) {
              var on = hash(i * 3 + h * 101) < hit[1];
              tl.set(el, { color: on ? "#E85D26" : (hash(i + h * 7) < 0.5 ? "#282826" : "#505048") }, hit[0]);
            });
          });

          // stat card arrives on the cut
          tl.fromTo("#f1_g2_card", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.18, ease: "power3.out" }, G2[0]);
          // counting-punch: 0 -> 9,000 from 3.11, lands on 3.6, deterministic frame rows
          var num = $("#f1_g2_num");
          var COUNT = 3.6 - 3.11, rows = Math.round(COUNT * FPS), ease = gsap.parseEase("expo.out");
          for (var f = 0; f <= rows; f++) {
            var v = f === rows ? 9000 : Math.round(9000 * ease(f / rows) / 10) * 10;
            tl.set(num, { textContent: v.toLocaleString("en-US") }, 3.11 + COUNT * (f / rows));
          }
          tl.fromTo(num, { scale: 1 }, { scale: 1.12, duration: 0.06, ease: "power4.out" }, 3.6);
          tl.to(num, { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.5)" }, 3.66);
          // "tiendas" + caption at 3.69
          tl.fromTo("#f1_g2_unit", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 3.69);
          tl.fromTo("#f1_g2_cap", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 3.77);
          tl.fromTo("#f1_g2_card", { scale: 1 }, { scale: 1.03, duration: G2[1] - 3.69, ease: "none", immediateRender: false }, 3.69);

          /* ================= g3 ================= */
          // phone rises on the cut, then slow push through the hold
          tl.fromTo("#f1_g3_phone", { y: 340, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, G3[0]);
          tl.fromTo("#f1_g3_phone", { scale: 1 }, { scale: 1.035, immediateRender: false, duration: END - G3[0] - 0.02, ease: "none" }, G3[0]);
          tl.fromTo("#f1_g3_head", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, G3[0] + 0.15);
          // staggered-reveal + overlay-pop: one bubble per hit
          [["#f1_g3_b1", 5.13], ["#f1_g3_b2", 5.99], ["#f1_g3_b3", 6.66]].forEach(function (b) {
            tl.fromTo(b[0], { autoAlpha: 0, scale: 0.4, y: 30 }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(2.2)" }, b[1]);
          });
          // 7.15: the "no" lands harder — punch + phone shake into the drop
          tl.fromTo("#f1_g3_b3", { scale: 1 }, { scale: 1.12, duration: 0.06, ease: "power4.out", immediateRender: false }, 7.15);
          tl.to("#f1_g3_b3", { scale: 1, duration: 0.3, ease: "elastic.out(1, 0.45)" }, 7.21);
          tl.fromTo("#f1_g3_screen", { x: 0, rotation: 0 }, {
            keyframes: [{ x: -14, rotation: -0.6, duration: 0.04 }, { x: 12, rotation: 0.5, duration: 0.04 }, { x: -8, rotation: -0.3, duration: 0.04 }, { x: 0, rotation: 0, duration: 0.05 }],
            ease: "none"
          }, 7.15);

          tl.seek(0);
          window.__timelines["01-f1"] = tl;
        })();
      </script>
