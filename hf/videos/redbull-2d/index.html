<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Inter'; font-weight: 300; src: url('assets/fonts/inter-300.ttf') format('truetype'); }
      @font-face { font-family: 'Inter'; font-weight: 600; src: url('assets/fonts/inter-600.ttf') format('truetype'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      .frame { position: absolute; inset: 0; width: 100%; height: 100%; }
      #type { position: absolute; inset: 0; pointer-events: none; font-family: 'Inter', sans-serif; color: #f2f4f8; z-index: 50; }
      .line { position: absolute; left: 90px; right: 90px; text-align: center; opacity: 0; }
      #end1, #end2 { font-weight: 300; font-size: 76px; letter-spacing: -0.02em; line-height: 1.1; }
      #end2 { font-weight: 600; }
      #abba { font-weight: 600; font-size: 26px; letter-spacing: 0.5em; color: #9aa3b2; }
      #grain { position: absolute; inset: 0; z-index: 40; pointer-events: none; mix-blend-mode: overlay; opacity: 0.22;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }
      #vign { position: absolute; inset: 0; z-index: 41; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,0.65) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="96" data-width="1080" data-height="1920">
      <div id="el-s01" class="frame" data-composition-id="s01" data-composition-src="compositions/s01.html" data-start="0" data-duration="10.3" data-track-index="1"></div>
      <div id="el-s02" class="frame" data-composition-id="s02" data-composition-src="compositions/s02.html" data-start="10.3" data-duration="7.1" data-track-index="1"></div>
      <div id="el-s03" class="frame" data-composition-id="s03" data-composition-src="compositions/s03.html" data-start="17.4" data-duration="9.7" data-track-index="1"></div>
      <div id="el-s04" class="frame" data-composition-id="s04" data-composition-src="compositions/s04.html" data-start="27.1" data-duration="4.8" data-track-index="1"></div>
      <div id="el-s05" class="frame" data-composition-id="s05" data-composition-src="compositions/s05.html" data-start="31.9" data-duration="11.3" data-track-index="1"></div>
      <div id="el-s06" class="frame" data-composition-id="s06" data-composition-src="compositions/s06.html" data-start="43.2" data-duration="9.8" data-track-index="1"></div>
      <div id="el-s07" class="frame" data-composition-id="s07" data-composition-src="compositions/s07.html" data-start="53.0" data-duration="7.7" data-track-index="1"></div>
      <div id="el-s08" class="frame" data-composition-id="s08" data-composition-src="compositions/s08.html" data-start="60.7" data-duration="9.1" data-track-index="1"></div>
      <div id="el-s09" class="frame" data-composition-id="s09" data-composition-src="compositions/s09.html" data-start="69.8" data-duration="4.2" data-track-index="1"></div>
      <div id="el-s10" class="frame" data-composition-id="s10" data-composition-src="compositions/s10.html" data-start="74.0" data-duration="22.0" data-track-index="1"></div>
      <div id="grain"></div><div id="vign"></div>
      <div id="type">
        <div class="line" id="end1" style="top: 760px">Don't sell the product.</div>
        <div class="line" id="end2" style="top: 860px">Build the world.</div>
        <div class="line" id="abba" style="top: 1500px">ABBA</div>
      </div>
      <audio id="vo" src="assets/narration.wav" data-start="0" data-duration="96" data-track-index="10" data-volume="1"></audio>
      <audio id="bed" src="assets/score.wav" data-start="0" data-duration="96" data-track-index="11" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#grain", { backgroundPosition: "0px 0px" }, { backgroundPosition: "2400px 1800px", duration: 96, ease: "steps(960)" }, 0);
      tl.fromTo("#end1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 1.2, ease: "power2.out" }, 89.9);
      tl.fromTo("#end2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 1.2, ease: "power2.out" }, 90.7);
      tl.to(["#end1", "#end2"], { opacity: 0, duration: 0.8, ease: "power1.in" }, 93.4);
      tl.fromTo("#abba", { opacity: 0 }, { opacity: 0.35, duration: 1.0 }, 94.2);
      tl.to("#abba", { opacity: 0, duration: 0.5 }, 95.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
