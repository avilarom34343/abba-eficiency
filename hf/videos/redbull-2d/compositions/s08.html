          /* ---------- the can (same design as s01 / s07) ---------- */
          function makeCan(p) {
            var P = 360, content = '';

              content += '<rect x="' + x0 + '" y="0" width="180" height="600" fill="url(#' + p + 'blue)"/>' +

                '<circle cx="' + (x0 + 90) + '" cy="300" r="64" fill="none" stroke="rgba(255,190,110,0.35)" stroke-width="2"/>' +
                '<rect x="' + (x0 + 196) + '" y="210" width="148" height="10" fill="#1a3a8a" opacity="0.8"/>' +
                '<rect x="' + (x0 + 196) + '" y="380" width="148" height="10" fill="#1a3a8a" opacity="0.8"/>' +
                '<rect x="' + (x0 - 12) + '" y="0" width="24" height="600" fill="url(#' + p + 'chk)"/>' +
                '<rect x="' + (x0 + 168) + '" y="0" width="24" height="600" fill="url(#' + p + 'chk)"/>';
            }
            var drops = '';
            for (var i = 0; i < 60; i++) {
              var dx = 18 + rnd() * 164, dy = 90 + rnd() * 460, r = 1.2 + rnd() * rnd() * 5;

            }
            var body = 'M10,82 Q10,62 26,52 L30,46 L170,46 L174,52 Q190,62 190,82 L190,548 Q190,566 176,576 L170,584 L30,584 L24,576 Q10,566 10,548 Z';
            return '<svg viewBox="0 0 200 600" width="400" height="1200" style="position:absolute;left:0;top:0">' +
              '<defs>' +
              '<linearGradient id="' + p + 'blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1f5c"/><stop offset="0.5" stop-color="#1238a0"/><stop offset="1" stop-color="#081845"/></linearGradient>' +

              '<g clip-path="url(#' + p + 'clip)">' +

          }
          function fig(name, x, y, s, rot, id) {
            var p = POSES[name], g = 'fill="none" stroke-linecap="round" stroke-linejoin="round"';

          function ridge(y0, amp, step, x0, x1) {
            var d = 'M' + x0 + ',' + y0, x = x0;
            while (x < x1) { x += step * (0.6 + rnd() * 0.8); d += ' L' + f(x) + ',' + f(y0 - rnd() * amp); }
            return d + ' L' + x1 + ',2100 L' + x0 + ',2100 Z';
          }

          /* ---------- A: athlete on the edge, about to jump ---------- */
          layer('s08_A', svg(
            '<rect width="1080" height="1920" fill="url(#s08_aSky)"/>' +

          var aCloud = layer('s08_A', svg(clouds), 's08_blur6');
          var aMid = layer('s08_A', svg(

            fig('crouch', 760, 1294, 1.9, 0, 's08_aFig'),

          var wind = '';
          for (var i = 0; i < 40; i++) wind += '<rect x="' + f(rnd() * 1400) + '" y="' + f(300 + rnd() * 1500) + '" width="' + f(60 + rnd() * 200) + '" height="2" fill="rgba(210,225,255,' + (0.15 + rnd() * 0.35).toFixed(2) + ')"/>';
          var aWind = layer('s08_A', svg('<g>' + wind + '</g>'));

          var beams = '';

          });
          layer('s08_B', svg(

            '<linearGradient id="s08_bBeam1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc890" stop-opacity="0.5"/><stop offset="1" stop-color="#ff8a40" stop-opacity="0"/></linearGradient>'), 's08_blur2');
          var crowdRows = [];
          for (var row = 0; row < 3; row++) {

          }

          /* ---------- C: race car accelerating ---------- */
          var streaks = '';

            streaks += '<rect x="' + f(rnd() * 3200) + '" y="' + f(y) + '" width="' + f(150 + rnd() * 500) + '" height="' + f(2 + rnd() * 5) + '" fill="' + (warm ? 'rgba(255,160,90,' : 'rgba(170,200,255,') + (0.2 + rnd() * 0.5).toFixed(2) + ')"/>';
          }
          layer('s08_C', svg('<rect width="1080" height="1920" fill="url(#s08_cBg)"/><circle cx="540" cy="760" r="260" fill="url(#s08_gSun)"/>',

          }
          var cCar = layer('s08_C', svg(
            '<ellipse cx="540" cy="1300" rx="520" ry="34" fill="rgba(0,0,0,0.7)" filter="url(#s08_cSoft)"/>' +
