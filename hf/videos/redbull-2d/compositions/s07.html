            '<linearGradient id="s07_gScr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c3a7a"/><stop offset="1" stop-color="#0a1430"/></linearGradient>' +
            '<filter id="s07_bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>');

          /* ---------- FLOOR: table top -> plinth, platform rings, racing circuit ---------- */
          var track = 'M540,1000 C800,1000 980,1050 980,1120 C980,1190 800,1240 540,1240 C280,1240 100,1190 100,1120 C100,1050 280,1000 540,1000 Z';
          $('s07_floor').innerHTML = svg(
            '<ellipse cx="540" cy="1130" rx="520" ry="150" fill="#060a14"/>' +
            '<path d="' + track + '" fill="none" stroke="#0d1220" stroke-width="44"/>' +
            '<path d="' + track + '" fill="none" stroke="url(#s07_gKerb)" stroke-width="48" stroke-dasharray="10 10" opacity="0.35"/>' +
            '<path d="' + track + '" fill="none" stroke="#0b0f1a" stroke-width="40"/>' +
            '<path id="s07_trA" d="' + track + '" fill="none" stroke="#ff4a2a" stroke-width="4" stroke-dasharray="180 1500" filter="url(#s07_glow)"/>' +
            '<path id="s07_trB" d="' + track + '" fill="none" stroke="#e8f0ff" stroke-width="3" stroke-dasharray="140 1540" filter="url(#s07_glow)"/>' +
            '<ellipse id="s07_ring1" cx="540" cy="1090" rx="160" ry="36" fill="none" stroke="rgba(140,180,255,0.55)" stroke-width="2"/>' +
            '<ellipse id="s07_ring2" cx="540" cy="1090" rx="250" ry="56" fill="none" stroke="rgba(255,170,100,0.35)" stroke-width="1.5"/>' +
            '<ellipse cx="540" cy="1094" rx="78" ry="17" fill="url(#s07_gTop)"/>' +
            '<ellipse cx="540" cy="1090" rx="74" ry="14" fill="url(#s07_gTop2)" stroke="rgba(190,210,255,0.6)" stroke-width="0.6"/>' +
            '<path d="M532,1100 L536,1160 L544,1160 L548,1100 Z" fill="#05070d"/>',
            '<linearGradient id="s07_gKerb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3a2a"/><stop offset="1" stop-color="#e8f0ff"/></linearGradient>' +
            '<radialGradient id="s07_gTop" cx="0.5" cy="0.4"><stop offset="0" stop-color="#2a3550"/><stop offset="1" stop-color="#05070d"/></radialGradient>' +
            '<radialGradient id="s07_gTop2" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#3a4a70"/><stop offset="0.5" stop-color="#141c30"/><stop offset="0.9" stop-color="#0a0f1c"/><stop offset="1" stop-color="#ff9a5a"/></radialGradient>' +
            '<filter id="s07_glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>');

          var aud = '';
          for (var row = 0; row < 3; row++) {
            var by = 1700 + row * 90, sc = 1 + row * 0.35, n = 9 - row * 2;
            for (var i = 0; i < n; i++) {
              var x = -40 + (i + rnd() * 0.6) * (1160 / n), s = sc * (0.85 + rnd() * 0.3);
              var arm = rnd() < 0.45, ax = (rnd() < 0.5 ? -1 : 1);
              aud += '<g transform="translate(' + f(x) + ',' + by + ') scale(' + s.toFixed(2) + ')">' +
                '<circle cx="0" cy="-92" r="30" fill="#020308" stroke="rgba(255,160,90,0.55)" stroke-width="2"/>' +
                '<path d="M-70,0 Q-66,-58 -30,-62 L30,-62 Q66,-58 70,0 L70,300 L-70,300 Z" fill="#020308" stroke="rgba(150,180,255,0.4)" stroke-width="2"/>' +

          }
          $('s07_near').innerHTML = svg(aud,

          /* ---------- particles (dust -> sparks) ---------- */
          var pl = $('s07_parts'), parts = [];
          for (var i = 0; i < 70; i++) {
            var p = document.createElement('div'), sz = 3 + rnd() * rnd() * 12;
            p.className = 's07_p';
            p.style.cssText = 'left:' + f(rnd() * 1080) + 'px;top:' + f(200 + rnd() * 1600) + 'px;width:' + f(sz) + 'px;height:' + f(sz) + 'px;opacity:' + (0.2 + rnd() * 0.6).toFixed(2) + ';filter:blur(' + (sz > 9 ? 3 : 0.5) + 'px)';
            pl.appendChild(p); parts.push(p);
          }

          /* ============ TIMELINE (local seconds) ============ */
          // Macro hold: label creeps, specular slides, can breathes
          tl.fromTo(label, { x: 0 }, { x: -260, duration: D, ease: 'none' }, 0);
          tl.fromTo(rlabel, { x: 0 }, { x: -260, duration: D, ease: 'none' }, 0);
          tl.fromTo($('s07_spot'), { opacity: 0.9, x: -30 }, { opacity: 0, x: 30, duration: 3.0, ease: 'power1.in' }, 0);
          tl.fromTo($('s07_canglow'), { opacity: 0.55, scale: 1 }, { opacity: 0.9, scale: 1.3, duration: 3, ease: 'sine.inOut' }, 0);

          // THE PULL-BACK: layers at different speeds (parallax), origin = the can
          var P0 = 0.45, P1 = 4.2, pe = 'power3.inOut';
          tl.fromTo($('s07_canwrap'), { scale: 0.9 }, { scale: 0.08, duration: P1 - P0, ease: pe }, P0);
          tl.fromTo($('s07_floor'), { scale: 10.5 }, { scale: 1, duration: P1 - P0, ease: pe }, P0);
          tl.fromTo($('s07_screens'), { scale: 5, y: -400 }, { scale: 1, y: 0, duration: P1 - P0, ease: pe }, P0);
          tl.fromTo($('s07_hangar'), { scale: 4.5, x: -500 }, { scale: 1, x: 0, duration: P1 - P0, ease: pe }, P0);
          tl.fromTo($('s07_mid'), { scale: 4 }, { scale: 1, duration: P1 - P0, ease: pe }, P0);
          tl.fromTo($('s07_rays'), { scale: 3 }, { scale: 1, duration: P1 - P0, ease: pe }, P0);
          tl.fromTo($('s07_far'), { scale: 1.9 }, { scale: 1, duration: P1 - P0, ease: pe }, P0);
          tl.fromTo($('s07_beacon'), { scale: 0.3 }, { scale: 1, duration: P1 - P0, ease: pe }, P0);
          tl.fromTo($('s07_near'), { y: 700, scale: 1.4 }, { y: 0, scale: 1, duration: 2.4, ease: 'power3.out', immediateRender: false }, 3.0);
          // whole camera: slight rotation settle, then slow continued drift
          tl.fromTo($('s07_cam'), { rotation: -4, y: 0 }, { rotation: 0, y: -40, duration: P1, ease: 'power2.out' }, 0);
          tl.to($('s07_cam'), { rotation: 1.2, scale: 0.94, y: -70, duration: D - P1, ease: 'sine.inOut' }, P1);

          // the room dissolves into the world
          tl.to($('s07_room'), { opacity: 0, duration: 1.6, ease: 'power1.inOut' }, 1.1);
          tl.fromTo($('s07_ring1'), { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.9);
          tl.fromTo($('s07_ring2'), { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.2);
          // circuit light trails race round the track
          tl.fromTo($('s07_trA'), { strokeDashoffset: 0 }, { strokeDashoffset: -1680 * 4, duration: D, ease: 'none' }, 0);
          tl.fromTo($('s07_trB'), { strokeDashoffset: -800 }, { strokeDashoffset: -800 - 1680 * 3, duration: D, ease: 'none' }, 0);
          // media studio screens
          tl.fromTo($('s07_screens'), { opacity: 0 }, { opacity: 1, duration: 0.9, ease: 'power1.out' }, 1.6);
          // stadium + lights come on
          tl.fromTo($('s07_mid'), { opacity: 0 }, { opacity: 1, duration: 1.0, ease: 'power1.out' }, 2.0);
          tl.fromTo($('s07_haze'), { opacity: 0 }, { opacity: 1, duration: 1.4 }, 2.2);
          tl.fromTo($('s07_rays'), { opacity: 0 }, { opacity: 0.7, duration: 1.2 }, 2.4);
          // mountains + sky
          tl.fromTo($('s07_far'), { opacity: 0 }, { opacity: 1, duration: 1.2, ease: 'power1.out' }, 2.5);
          // hangar + jet
          tl.fromTo($('s07_hangar'), { opacity: 0 }, { opacity: 1, duration: 0.9 }, 2.8);
          tl.fromTo(jet, { x: -160, y: 300, rotation: -6 }, { x: 1300, y: 170, rotation: -3, duration: 4.6, ease: 'none' }, 3.1);
          // the can's beacon glow as it becomes tiny
          tl.fromTo($('s07_beacon'), { opacity: 0 }, { opacity: 0.8, duration: 1.2 }, 3.0);

          // 4.0  "...una empresa de entretenimiento": the world switches on
          tl.fromTo($('s07_flash'), { opacity: 0 }, { opacity: 0.55, duration: 0.12, ease: 'power2.out' }, 4.0);
          tl.to($('s07_flash'), { opacity: 0, duration: 0.9, ease: 'power2.in' }, 4.12);
          tl.fromTo($('s07_flare'), { opacity: 0, scaleX: 0.3 }, { opacity: 0.9, scaleX: 1, duration: 0.25, ease: 'power2.out' }, 4.0);
          tl.to($('s07_flare'), { opacity: 0, scaleX: 1.4, duration: 1.2, ease: 'power1.in' }, 4.25);
          tl.fromTo($('s07_rays'), { rotation: 0 }, { rotation: 6, duration: D - 4.0, ease: 'sine.inOut', immediateRender: false }, 4.0);
          tl.fromTo(root.querySelectorAll('.s07_lamp'), { scale: 1, transformOrigin: '50% 50%' }, { scale: 1.6, duration: 0.3, ease: 'power2.out', stagger: 0.06, yoyo: true, repeat: 1 }, 4.0);
          tl.fromTo($('s07_ring2'), { attr: { rx: 250, ry: 56 }, opacity: 1 }, { attr: { rx: 520, ry: 120 }, opacity: 0, duration: 1.4, ease: 'power2.out', immediateRender: false }, 4.0);
          tl.fromTo($('s07_beacon'), { opacity: 0.8 }, { opacity: 1, duration: 0.6, yoyo: true, repeat: 3, ease: 'sine.inOut', immediateRender: false }, 4.2);

          // continuous life: crowd flashes, phone lights, screens bob, particles drift
          var fl = root.querySelectorAll('.s07_fl');
          for (var i = 0; i < fl.length; i++) {
            tl.fromTo(fl[i], { opacity: 0 }, { opacity: 1, duration: 0.08, yoyo: true, repeat: 1 }, 2.2 + rnd() * 5.3);
          }
          root.querySelectorAll('.s07_ph').forEach(function (el, k) {
            tl.fromTo(el, { opacity: 0.4 }, { opacity: 1, duration: 0.5 + (k % 3) * 0.2, yoyo: true, repeat: 5, ease: 'sine.inOut' }, 3 + (k % 5) * 0.1);
          });
          root.querySelectorAll('.s07_scr').forEach(function (el, k) {
            tl.fromTo(el, { y: 0 }, { y: (k % 2 ? 10 : -10), duration: 1.6, yoyo: true, repeat: 3, ease: 'sine.inOut' }, k * 0.1);
          });
          parts.forEach(function (p, k) {
            var dy = -(120 + rnd() * 380), dx = (rnd() - 0.5) * 160;
            tl.fromTo(p, { x: 0, y: 0 }, { x: dx, y: dy, duration: D, ease: 'none' }, 0);
          });

          window.__timelines["s07"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
