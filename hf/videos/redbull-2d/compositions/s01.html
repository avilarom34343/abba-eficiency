          // aircraft silhouettes with contrails

          /* ---------- particles: back motes, front bokeh (DOF), sparks ---------- */

            var arr = [];
            for (var i = 0; i < n; i++) {
              var m = document.createElement('div'); m.className = 's01_mote';

              m.style.width = m.style.height = (r * 2) + 'px';
              m.style.filter = 'blur(' + blur + 'px)';
              m.style.opacity = (op * (0.4 + rnd() * 0.6)).toFixed(2);
              host.appendChild(m);
              arr.push({ el: m, x: rnd() * 1080, y: rnd() * 1920, vx: (rnd() - 0.5) * 60, vy: -30 - rnd() * 90 });
            }
            return arr;
          }
          var back = motes($('s01_back'), 70, 1.5, 4, 0.5, 0.8);
          var front = motes($('s01_front'), 14, 16, 46, 10, 0.35);
          back.concat(front).forEach(function (m) {
            tl.fromTo(m.el, { x: m.x, y: m.y }, { x: m.x + m.vx * D / 3, y: m.y + m.vy * D / 3, duration: D, ease: 'none' }, 0);
          });
          var sparks = [];
          for (i = 0; i < 44; i++) {
            var s = document.createElement('div'); s.className = 's01_spark';
            $('s01_sparks').appendChild(s);
            sparks.push({ el: s, a: rnd() * 360, d: 300 + rnd() * 700, t: rnd() * 0.15 });
          }

          var burst = $('s01_burst'), rays = [];
          for (i = 0; i < 28; i++) {
            var ry = document.createElement('div'); ry.className = 's01_ray';
            ry.style.transform = 'rotate(' + (i * 360 / 28 + (rnd() - 0.5) * 6) + 'deg)';
            burst.appendChild(ry); rays.push(ry);
          }
          var ghosts = [];
          [[620, 1000, 90], [700, 760, 160], [820, 420, 60], [880, 260, 220]].forEach(function (g) {
            var el = document.createElement('div'); el.className = 's01_ghost';
            el.style.left = (g[0] - g[2]) + 'px'; el.style.top = (g[1] - g[2]) + 'px';
            el.style.width = el.style.height = (g[2] * 2) + 'px';
            $('s01_ghosts').appendChild(el); ghosts.push(el);
          });

          /* ================= TIMELINE ================= */
          // fade up from black
          tl.fromTo($('s01_dark'), { opacity: 1 }, { opacity: 0, duration: 1.0, ease: 'power2.out' }, 0);

          // the can rotates slowly the whole scene (label scroll = cylinder rotation)
          tl.fromTo(label, { x: 0 }, { x: -540, duration: D, ease: 'none' }, 0);
          tl.fromTo(drops, { y: 0 }, { y: 6, duration: D, ease: 'none' }, 0);

          // act 1: extreme macro, camera creeping closer, slight drift + tilt
          tl.fromTo(canwrap, { scale: 2.6, x: 0, y: 40, rotation: -3 }, { scale: 3.15, x: -30, y: -10, rotation: 1.5, duration: T1, ease: 'sine.inOut' }, 0);
          tl.fromTo($('s01_beam'), { x: -120, opacity: 0.5 }, { x: 140, opacity: 1, duration: T1, ease: 'sine.inOut' }, 0);
          tl.fromTo($('s01_ember'), { y: 120, opacity: 0.6 }, { y: -80, opacity: 1, duration: D, ease: 'sine.inOut' }, 0);

          // act 2 (5.8): sudden pull-back — can becomes tiny, world forms behind
          var PB = 0.95;
          tl.to(canwrap, { scale: 0.38, x: 0, y: 330, rotation: 0, duration: PB, ease: 'expo.inOut', immediateRender: false }, T1 - 0.1);
          tl.fromTo(canwrap, { filter: 'blur(0px)' }, { filter: 'blur(7px)', duration: PB / 2, ease: 'power2.in' }, T1 - 0.1);
          tl.to(canwrap, { filter: 'blur(0px)', duration: PB / 2, ease: 'power2.out' }, T1 - 0.1 + PB / 2);
          tl.to($('s01_beam'), { opacity: 0.35, duration: PB, ease: 'power2.out' }, T1);
          tl.fromTo($('s01_world'), { opacity: 0 }, { opacity: 1, duration: 0.8, ease: 'power2.out' }, T1 + 0.05);
          // parallax pull-back: near layers shrink more than far ones
          var par = [['s01_sky', 1.08, 1.0], ['s01_starsL', 1.12, 1.0], ['s01_rays', 1.15, 1.0], ['s01_far', 1.25, 1.0], ['s01_planes', 1.35, 1.0], ['s01_mid', 1.5, 1.0], ['s01_haze', 1.6, 1.0], ['s01_ground', 1.9, 1.0]];
          par.forEach(function (p) {
            tl.fromTo($(p[0]), { scale: p[1] }, { scale: p[2], duration: 1.3, ease: 'expo.out' }, T1);
          });
          tl.fromTo($('s01_mid'), { y: 160 }, { y: 0, duration: 1.6, ease: 'power3.out' }, T1);
          tl.fromTo($('s01_far'), { y: 90 }, { y: 0, duration: 1.8, ease: 'power3.out' }, T1);
          tl.fromTo($('s01_reflect'), { opacity: 0 }, { opacity: 1, duration: 0.6 }, T1 + 0.5);
          tl.fromTo($('s01_canglow'), { opacity: 0 }, { opacity: 0.45, duration: 0.8 }, T1 + 0.4);
          // world keeps living: aircraft cross, light trails race, rays rotate, lamps & crowd twinkle
          tl.fromTo($('s01_j1'), { attr: { transform: 'translate(150,560) rotate(-8) scale(1.3)' } }, { attr: { transform: 'translate(820,470) rotate(-8) scale(1.3)' }, duration: D - T1, ease: 'none' }, T1);
          tl.fromTo($('s01_j2'), { attr: { transform: 'translate(260,640) rotate(-8) scale(0.9)' } }, { attr: { transform: 'translate(700,580) rotate(-8) scale(0.9)' }, duration: D - T1, ease: 'none' }, T1);
          tl.fromTo($('s01_j3'), { attr: { transform: 'translate(980,330) rotate(186) scale(0.7)' } }, { attr: { transform: 'translate(640,370) rotate(186) scale(0.7)' }, duration: D - T1, ease: 'none' }, T1);
          tl.fromTo(root.querySelector('#s01_trailA'), { attr: { 'stroke-dashoffset': 1560 } }, { attr: { 'stroke-dashoffset': -1560 }, duration: 2.2, ease: 'none', repeat: 1 }, T1);
          tl.fromTo(root.querySelector('#s01_trailB'), { attr: { 'stroke-dashoffset': 1200 } }, { attr: { 'stroke-dashoffset': -1920 }, duration: 2.2, ease: 'none', repeat: 1 }, T1 + 0.3);
          tl.fromTo($('s01_rays'), { rotation: -4 }, { rotation: 4, duration: D - T1, ease: 'none' }, T1);
          root.querySelectorAll('.s01_lamp').forEach(function (l, i) {
            tl.fromTo(l, { opacity: 0.6 }, { opacity: 1, duration: 0.35 + i * 0.07, ease: 'sine.inOut', yoyo: true, repeat: 6 }, T1);
          });
          var bks = root.querySelectorAll('.s01_bk');
          for (i = 0; i < bks.length; i += 4) {
            tl.fromTo(bks[i], { opacity: 0.2 }, { opacity: 1, duration: 0.2 + rnd() * 0.3, yoyo: true, repeat: 7, ease: 'sine.inOut' }, T1 + rnd() * 0.5);
          }

          // act 3 (8.7, "identidad"): light bursts outward, the universe locks in around the can
          tl.fromTo($('s01_flash'), { opacity: 0 }, { opacity: 0.85, duration: 0.08, ease: 'power2.out' }, T2);
          tl.to($('s01_flash'), { opacity: 0, duration: 0.9, ease: 'power2.out' }, T2 + 0.08);
          rays.forEach(function (r, i) {
            tl.fromTo(r, { scaleY: 0.05, opacity: 1 }, { scaleY: 1, opacity: 0, duration: 1.1 + (i % 3) * 0.15, ease: 'expo.out' }, T2 + (i % 4) * 0.02);
          });
          tl.fromTo(burst, { rotation: 0 }, { rotation: 20, duration: D - T2, ease: 'power1.out' }, T2);
          tl.fromTo($('s01_ring'), { scale: 0.1, opacity: 1 }, { scale: 4.5, opacity: 0, duration: 1.2, ease: 'expo.out' }, T2);
          sparks.forEach(function (s) {
            var a = s.a * Math.PI / 180;
            tl.fromTo(s.el, { x: 0, y: 0, rotation: s.a + 90, opacity: 1 },
              { x: Math.cos(a) * s.d, y: Math.sin(a) * s.d + 120, opacity: 0, duration: 1.3, ease: 'power3.out' }, T2 + s.t);
          });
          tl.fromTo($('s01_streak'), { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1.2, duration: 0.25, ease: 'power2.out' }, T2);
          tl.to($('s01_streak'), { opacity: 0, duration: 1.2, ease: 'power2.in' }, T2 + 0.3);
          ghosts.forEach(function (g, i) {
            tl.fromTo(g, { opacity: 0 }, { opacity: 0.9 - i * 0.12, duration: 0.2 }, T2 + 0.02);
            tl.to(g, { opacity: 0, duration: 1.4, ease: 'power2.in' }, T2 + 0.4);
          });
          // world expands into a universe: far layers grow outward, orbits lock in
          tl.fromTo($('s01_orbits'), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 1.0, ease: 'expo.out' }, T2);
          tl.fromTo(root.querySelector('#s01_o1'), { rotation: 0, transformOrigin: '50% 50%' }, { rotation: 6, duration: D - T2, ease: 'none' }, T2);
          tl.to($('s01_far'), { scale: 1.12, y: -60, duration: D - T2, ease: 'power2.out', immediateRender: false }, T2);
          tl.to($('s01_mid'), { scale: 1.08, y: -30, duration: D - T2, ease: 'power2.out', immediateRender: false }, T2);
          tl.fromTo($('s01_canglow'), { scale: 1 }, { scale: 1.6, duration: 0.4, ease: 'power3.out', immediateRender: false }, T2);
          tl.to($('s01_canglow'), { opacity: 0.85, duration: 0.3 }, T2);
          // camera: slow push during act 2, small lock-in jolt at 8.7, then slow rotation
          var cam = $('s01_cam');
          tl.fromTo(cam, { scale: 1, rotation: 0 }, { scale: 1.06, rotation: -1, duration: T2 - T1, ease: 'sine.inOut' }, T1);
          tl.to(cam, { scale: 1.0, duration: 0.12, ease: 'power3.out' }, T2);
          tl.to(cam, { scale: 1.1, rotation: 1.5, duration: D - T2 - 0.12, ease: 'sine.inOut' }, T2 + 0.12);
          [14, -10, 7, -4, 2, 0].forEach(function (a, i) { tl.set($('s01_world'), { x: a, y: -a * 0.6 }, T2 + i / 30); });

          window.__timelines['s01'] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
