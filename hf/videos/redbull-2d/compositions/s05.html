      <script>
        (function () {
          var root = document.querySelector('[data-composition-id="s05"]');
          var $ = function (id) { return root.querySelector('#' + id); };
          var tl = gsap.timeline({ paused: true });
          var D = 11.3;
          var seed = 5055;
          function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
          function r(a, b) { return a + (b - a) * rnd(); }
          function div(cls, css, parent) { var d = document.createElement('div'); d.className = cls; d.style.cssText = css; parent.appendChild(d); return d; }
          // fromTo that turns off immediateRender for any later tween on a property already animated on that element
          var seen = [];
          function F(el, from, to, t) {
            var rec = null;
            for (var i = 0; i < seen.length; i++) if (seen[i].el === el) rec = seen[i];
            if (!rec) { rec = { el: el, p: {} }; seen.push(rec); }
            var rep = false;
            Object.keys(from).forEach(function (k) { if (k === 'transformOrigin' || k === 'svgOrigin') return; if (rec.p[k]) rep = true; rec.p[k] = 1; });
            if (rep) to.immediateRender = false;
            tl.fromTo(el, from, to, t);
          }
          function cut(off, on, t) { tl.set(off, { opacity: 0 }, t); tl.set(on, { opacity: 1 }, t); }
          function loops(dur, cyc) { return Math.max(0, Math.floor(dur / cyc) - 1); }

          // cut points (local) — narration: 37.7 Motocross / 39.0 Snowboard / 40.3 Aviones / 41.6 Fórmula Uno
          var TB = 5.8, TC = 7.1, TD = 8.4, TE = 9.7;
          cut($('s05_A'), $('s05_B'), TB);
          cut($('s05_B'), $('s05_C'), TC);
          cut($('s05_C'), $('s05_D'), TD);
          cut($('s05_D'), $('s05_E'), TE);

          // ---------- reusable wheel (tire, knobs, spokes) ----------
          function wheel(cx, cy, R, spokes, id, knobs) {
            var s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="#06080d" stroke-width="' + (R * 0.3).toFixed(0) + '" />';
            if (knobs) s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (R * 1.13).toFixed(0) + '" fill="none" stroke="#06080d" stroke-width="6" stroke-dasharray="6 10" />';
            s += '<g id="' + id + '">';
            for (var i = 0; i < spokes; i++) {
              var a = i / spokes * Math.PI * 2;
              s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + Math.cos(a) * R * 0.78).toFixed(1) + '" y2="' + (cy + Math.sin(a) * R * 0.78).toFixed(1) + '" stroke="#5a6478" stroke-width="2.5" />';
            }
            s += '</g><circle cx="' + cx + '" cy="' + cy + '" r="' + (R * 0.8).toFixed(0) + '" fill="none" stroke="#b8c2d6" stroke-width="4" opacity="0.8" />';
            s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (R * 0.16).toFixed(0) + '" fill="#a8b2c6" />';
            return s;
          }

          // ================= A: door of light (0 – 5.8) =================
          var Acam = $('s05_Acam');
          F(Acam, { scale: 1, y: 0 }, { scale: 1.45, y: 20, duration: 4.6, ease: 'sine.inOut' }, 0);
          F(Acam, { scale: 1.45, y: 20 }, { scale: 7.5, y: 0, duration: 1.2, ease: 'power3.in' }, 4.6);
          F(Acam, { filter: 'blur(0px)' }, { filter: 'blur(5px)', duration: 0.5, ease: 'power2.in' }, 5.3);
          F($('s05_crack'), { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: 0.6, ease: 'power2.out' }, 0.2);
          F($('s05_crack'), { opacity: 1 }, { opacity: 0, duration: 0.5 }, 1.1);
          F($('s05_door'), { clipPath: 'inset(0% 50% 0% 50%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.8, ease: 'power2.inOut' }, 0.8);
          F($('s05_spill'), { scaleX: 0.02, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 1.8, ease: 'power2.inOut' }, 0.8);
          F($('s05_doorGlow'), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.1, duration: 2.2, ease: 'power2.out' }, 0.6);
          F($('s05_rays'), { opacity: 0, rotation: -6 }, { opacity: 1, rotation: 6, duration: 5.2, ease: 'sine.inOut' }, 0.7);
          F($('s05_Ahaze1'), { x: -100 }, { x: 160, duration: TB, ease: 'none' }, 0);
          F($('s05_Ahaze2'), { x: 120 }, { x: -140, duration: TB, ease: 'none' }, 0);

          F($('s05_walker'), { scale: 1.15, y: 220, opacity: 0.0 }, { scale: 0.62, y: -40, opacity: 1, duration: 4.4, ease: 'sine.inOut' }, 0);
          F($('s05_legL'), { rotation: -5, svgOrigin: '200 420' }, { rotation: 5, duration: 0.45, ease: 'sine.inOut', yoyo: true, repeat: loops(4.4, 0.45) }, 0);
          F($('s05_legR'), { rotation: 5, svgOrigin: '200 420' }, { rotation: -5, duration: 0.45, ease: 'sine.inOut', yoyo: true, repeat: loops(4.4, 0.45) }, 0);
          F($('s05_walker'), { opacity: 1 }, { opacity: 0, duration: 0.6 }, 4.5);
          // dust motes floating in the light shaft, sucked toward the door during the dive
          (function () {
            var p = $('s05_dust');
            for (var i = 0; i < 70; i++) {
              var s = r(2, 7), x = r(260, 820), y = r(500, 1700);
              var d = div('s05_dot', 'left:' + x.toFixed(0) + 'px;top:' + y.toFixed(0) + 'px;width:' + s.toFixed(1) + 'px;height:' + s.toFixed(1) + 'px;background:#ffe2bc;opacity:' + r(0.3, 0.9).toFixed(2) + ';filter:blur(' + (s > 5 ? 2 : 0.5) + 'px)', p);
              F(d, { x: 0, y: 0 }, { x: r(-60, 60), y: r(-160, -40), duration: 4.6, ease: 'none' }, 0);
              F(d, { x: 0, y: 0, scale: 1 }, { x: (540 - x) * 0.9, y: (960 - y) * 0.9, scale: 0.2, duration: 1.2, ease: 'power3.in', immediateRender: false }, 4.6);
            }
          })();
          // radial speed lines for the dive
          (function () {
            var s = '<defs><linearGradient id="s05_spdG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0" /><stop offset="1" stop-color="#fff0dc" stop-opacity="0.9" /></linearGradient></defs>';
            for (var i = 0; i < 90; i++) {
              var a = r(0, 360), r0 = r(260, 520), len = r(200, 600);
              s += '<rect x="' + r0.toFixed(0) + '" y="-1.5" width="' + len.toFixed(0) + '" height="' + r(1.5, 4).toFixed(1) + '" fill="url(#s05_spdG)" transform="translate(1000,1000) rotate(' + a.toFixed(1) + ')" />';

          var flash = $('s05_flash');
          F(flash, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power2.in' }, 5.55);
          F(flash, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power2.out' }, 5.8);

          // ================= B: motocross (5.8 – 7.1) =================
          $('s05_wheelR').innerHTML = wheel(150, 340, 80, 14, 's05_spR', true);
          $('s05_wheelF').innerHTML = wheel(455, 340, 80, 14, 's05_spF', true);
          // crowd skyline + camera flashes
          (function () {
            var d = 'M-100,1460 L-100,1400 ';
            for (var x = -100; x < 1200; x += r(16, 26)) { var h = r(1370, 1395); d += 'L' + x.toFixed(0) + ',' + (h + 10).toFixed(0) + ' Q' + (x + 8).toFixed(0) + ',' + h.toFixed(0) + ' ' + (x + 16).toFixed(0) + ',' + (h + 10).toFixed(0) + ' '; }
            d += 'L1200,1460 Z';
            $('s05_crowdPath').setAttribute('d', d);
            var p = $('s05_Bflashes');
            for (var i = 0; i < 26; i++) {
              var f = div('s05_dot', 'left:' + r(0, 1080).toFixed(0) + 'px;top:' + r(1380, 1430).toFixed(0) + 'px;width:14px;height:14px;opacity:0;background:radial-gradient(circle,#fff 0%,rgba(220,235,255,0.6) 40%,transparent 70%)', p);
              var t = TB + r(0, 1.1);
              F(f, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 2.2, duration: 0.06, ease: 'none', yoyo: true, repeat: 1 }, t);
