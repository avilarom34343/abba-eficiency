<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: 'Inter'; font-weight: 300; src: url('assets/fonts/inter-300.ttf'); }
        @font-face { font-family: 'Inter'; font-weight: 600; src: url('assets/fonts/inter-600.ttf'); }
        [data-composition-id="s02"] #stage {
          position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; background: #03050a;
        }
        [data-composition-id="s02"] #stage * { box-sizing: border-box; margin: 0; padding: 0; }
        [data-composition-id="s02"] #stage svg { position: absolute; left: 0; top: 0; overflow: visible; }
        [data-composition-id="s02"] #stage .s02_full { position: absolute; inset: 0; }
        [data-composition-id="s02"] #stage #s02_cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
        [data-composition-id="s02"] #stage #s02_shelf { position: absolute; left: -240px; top: -700px; width: 1560px; height: 2620px; }
        [data-composition-id="s02"] #stage .s02_tube {
          position: absolute; height: 22px; border-radius: 11px;
          background: linear-gradient(180deg, #ffffff, #d8e6ff 60%, #9fb6e0);
          box-shadow: 0 0 30px 10px rgba(170,200,255,0.55), 0 0 120px 40px rgba(120,160,255,0.25);
        }
        [data-composition-id="s02"] #stage #s02_topwash {
          position: absolute; left: -300px; top: -700px; width: 1680px; height: 1600px;
          background: radial-gradient(ellipse 60% 50% at 50% 30%, rgba(150,185,255,0.20), transparent 70%);
          mix-blend-mode: screen;
        }
        [data-composition-id="s02"] #stage .s02_beam {
          position: absolute; top: -700px; width: 260px; height: 2800px; transform-origin: 50% 0%;
          background: linear-gradient(90deg, transparent, rgba(150,185,255,0.13) 50%, transparent);
          filter: blur(18px); mix-blend-mode: screen;
        }
        [data-composition-id="s02"] #stage #s02_ember {
          position: absolute; right: -300px; top: 1100px; width: 700px; height: 900px;
          background: radial-gradient(ellipse, rgba(255,120,40,0.28), transparent 65%); filter: blur(10px); mix-blend-mode: screen;
        }
        [data-composition-id="s02"] #stage #s02_spot {
          position: absolute; left: 430px; top: -200px; width: 220px; height: 1900px; transform-origin: 50% 100%;
          background: linear-gradient(180deg, rgba(255,210,150,0) 0%, rgba(255,210,150,0.10) 60%, rgba(255,220,170,0.32) 100%);
          -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
          mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
          filter: blur(8px); mix-blend-mode: screen; opacity: 0;
        }
        [data-composition-id="s02"] #stage #s02_halo {
          position: absolute; left: 380px; top: 1430px; width: 320px; height: 320px; border-radius: 50%;
          background: radial-gradient(circle, rgba(255,190,110,0.55), rgba(255,130,50,0.15) 45%, transparent 70%);
          mix-blend-mode: screen; opacity: 0;
        }
        [data-composition-id="s02"] #stage #s02_small {
          position: absolute; left: 503px; top: 1478px; width: 74px; height: 222px; filter: brightness(0.35);
        }
        [data-composition-id="s02"] #stage #s02_glint {
          position: absolute; left: 515px; top: 1500px; width: 10px; height: 170px; border-radius: 5px; opacity: 0;
          background: linear-gradient(180deg, transparent, rgba(255,255,255,0.95), transparent); filter: blur(1px); mix-blend-mode: screen;
        }
        [data-composition-id="s02"] #stage #s02_star {
          position: absolute; left: 500px; top: 1470px; width: 40px; height: 40px; opacity: 0; mix-blend-mode: screen;
          background:
            linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.95) 50%, transparent 100%) center / 100% 2px no-repeat,
            linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.95) 50%, transparent 100%) center / 2px 100% no-repeat,
            radial-gradient(circle, rgba(255,240,210,1) 0%, transparent 35%);
        }
        [data-composition-id="s02"] #stage .s02_mote {
          position: absolute; left: 0; top: 0; border-radius: 50%;
          background: radial-gradient(circle, rgba(225,235,255,0.95) 0%, rgba(160,195,255,0.25) 45%, transparent 70%);
        }
        [data-composition-id="s02"] #stage #s02_fg { position: absolute; inset: 0; transform-origin: 50% 80%; }
        [data-composition-id="s02"] #stage #s02_fgL, [data-composition-id="s02"] #stage #s02_fgR { position: absolute; filter: blur(16px); }
        [data-composition-id="s02"] #stage #s02_fgL { left: -330px; top: 900px; width: 520px; height: 1300px; }
        [data-composition-id="s02"] #stage #s02_fgR { right: -380px; top: 1100px; width: 520px; height: 1100px; }
        [data-composition-id="s02"] #stage #s02_grade {
          position: absolute; inset: 0; pointer-events: none;
          background: linear-gradient(180deg, rgba(2,4,10,0.55) 0%, transparent 25%, transparent 70%, rgba(2,4,10,0.6) 100%);
        }
      </style>

      <div id="stage" data-composition-id="s02" data-width="1080" data-height="1920" data-duration="7.1" style="width:1080px;height:1920px">
        <div id="s02_cam">
          <div id="s02_shelf"></div>
          <div id="s02_beamA" class="s02_beam" style="left:60px"></div>
          <div id="s02_beamB" class="s02_beam" style="left:720px"></div>
          <div id="s02_topwash"></div>
          <div id="s02_tube1" class="s02_tube" style="left:-120px; top:-560px; width:560px"></div>
          <div id="s02_tube2" class="s02_tube" style="left:640px; top:-560px; width:560px"></div>
          <div id="s02_ember"></div>
          <div id="s02_spot"></div>
          <div id="s02_halo"></div>
          <div id="s02_small"></div>
          <div id="s02_glint"></div>
          <div id="s02_star"></div>
          <div id="s02_motes" class="s02_full"></div>
        </div>
        <div id="s02_fg">
          <div id="s02_fgL"></div>
          <div id="s02_fgR"></div>
          <div id="s02_bokeh" class="s02_full"></div>
        </div>
        <div id="s02_grade"></div>
      </div>

      <script>
        (function () {
          var root = document.querySelector('[data-composition-id="s02"]');
          var $ = function (id) { return root.querySelector('#' + id); };
          var tl = gsap.timeline({ paused: true });
          var D = 7.1;
          var seed = 802;
          function rnd() { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; var t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }

          /* ---------- the newcomer: slim two-tone can (same design as s01) ---------- */
          function makeCan(p, W, H) {
            var P = 360, content = '';
            for (var k = -1; k <= 2; k++) {
              var x0 = k * P;
              content += '<rect x="' + x0 + '" y="0" width="180" height="600" fill="url(#' + p + 'blue)"/>' +
                '<rect x="' + (x0 + 180) + '" y="0" width="180" height="600" fill="url(#' + p + 'silv)"/>' +
                '<circle cx="' + (x0 + 90) + '" cy="300" r="52" fill="url(#' + p + 'sun)"/>' +
                '<rect x="' + (x0 + 196) + '" y="210" width="148" height="10" fill="#1a3a8a" opacity="0.8"/>' +
                '<rect x="' + (x0 + 196) + '" y="380" width="148" height="10" fill="#1a3a8a" opacity="0.8"/>' +
                '<rect x="' + (x0 - 12) + '" y="0" width="24" height="600" fill="url(#' + p + 'chk)"/>' +
                '<rect x="' + (x0 + 168) + '" y="0" width="24" height="600" fill="url(#' + p + 'chk)"/>';
            }
            var drops = '';
            for (var i = 0; i < 40; i++) {
              var dx = 18 + rnd() * 164, dy = 90 + rnd() * 460, r = 1.5 + rnd() * rnd() * 5;
              drops += '<circle cx="' + dx.toFixed(1) + '" cy="' + dy.toFixed(1) + '" r="' + r.toFixed(2) + '" fill="rgba(220,235,255,0.35)"/>';
            }
            var body = 'M10,82 Q10,62 26,52 L30,46 L170,46 L174,52 Q190,62 190,82 L190,548 Q190,566 176,576 L170,584 L30,584 L24,576 Q10,566 10,548 Z';
            return '<svg viewBox="0 0 200 600" width="' + W + '" height="' + H + '"><defs>' +
              '<linearGradient id="' + p + 'blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1f5c"/><stop offset="0.5" stop-color="#1238a0"/><stop offset="1" stop-color="#081845"/></linearGradient>' +
              '<linearGradient id="' + p + 'silv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa6b8"/><stop offset="0.5" stop-color="#e6ebf2"/><stop offset="1" stop-color="#8794a8"/></linearGradient>' +
              '<radialGradient id="' + p + 'sun"><stop offset="0" stop-color="#fff2c0"/><stop offset="0.45" stop-color="#ffb347"/><stop offset="0.85" stop-color="#e8562a"/><stop offset="1" stop-color="#b8321a"/></radialGradient>' +
              '<pattern id="' + p + 'chk" patternUnits="userSpaceOnUse" width="24" height="24"><rect width="24" height="24" fill="#c8d0dc"/><polygon points="12,0 24,12 12,24 0,12" fill="#10308a"/></pattern>' +
              '<linearGradient id="' + p + 'shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity="0.85"/><stop offset="0.3" stop-color="#000" stop-opacity="0"/><stop offset="0.55" stop-color="#000" stop-opacity="0.12"/><stop offset="1" stop-color="#000" stop-opacity="0.9"/></linearGradient>' +
              '<linearGradient id="' + p + 'rimW" x1="0" y1="0" x2="1" y2="0"><stop offset="0.86" stop-color="#ff8a3a" stop-opacity="0"/><stop offset="0.95" stop-color="#ff9a4a" stop-opacity="0.8"/><stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/></linearGradient>' +
              '<linearGradient id="' + p + 'spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.2" stop-color="#fff" stop-opacity="0.85"/><stop offset="0.8" stop-color="#fff" stop-opacity="0.75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
              '<linearGradient id="' + p + 'lid" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4250"/><stop offset="0.3" stop-color="#f2f5fa"/><stop offset="0.6" stop-color="#9aa4b4"/><stop offset="1" stop-color="#2a303c"/></linearGradient>' +
              '<clipPath id="' + p + 'clip"><path d="' + body + '"/></clipPath></defs>' +
              '<g clip-path="url(#' + p + 'clip)"><g id="' + p + 'label">' + content + '</g>' +
              '<rect x="0" y="40" width="200" height="56" fill="url(#' + p + 'lid)" opacity="0.92"/>' +
              '<rect x="0" y="540" width="200" height="50" fill="url(#' + p + 'lid)" opacity="0.92"/>' +
              '<rect width="200" height="600" fill="url(#' + p + 'shade)"/><rect width="200" height="600" fill="url(#' + p + 'rimW)"/>' +
              '<rect x="54" y="60" width="10" height="520" fill="url(#' + p + 'spec)"/>' + drops + '</g>' +
              '<ellipse cx="100" cy="46" rx="70" ry="9" fill="url(#' + p + 'lid)"/><ellipse cx="100" cy="46" rx="58" ry="6" fill="#4a5262"/></svg>';
          }
          $('s02_small').innerHTML = makeCan('s02_c', 74, 222);
          var smallLabel = root.querySelector('#s02_clabel');

          /* ---------- the giants: archetype red cola cans, dark cola bottles, lemon-lime green bottles ---------- */
          function redCan(x, base, w, h) {
            var y = base - h;
            return '<g transform="translate(' + x + ',' + y + ')">' +
              '<rect x="0" y="0" width="' + w + '" height="' + h + '" rx="' + w * 0.12 + '" fill="url(#s02_gRed)"/>' +
              '<rect x="0" y="' + h * 0.04 + '" width="' + w + '" height="' + h * 0.08 + '" fill="url(#s02_gMetal)"/>' +
              '<rect x="0" y="' + h * 0.9 + '" width="' + w + '" height="' + h * 0.1 + '" rx="' + w * 0.1 + '" fill="url(#s02_gMetal)"/>' +
              '<rect x="0" y="' + h * 0.52 + '" width="' + w + '" height="' + h * 0.035 + '" fill="#f4efe8" opacity="0.9"/>' +
              '<rect x="0" y="' + h * 0.58 + '" width="' + w + '" height="' + h * 0.012 + '" fill="#f4efe8" opacity="0.7"/>' +
              '<rect x="0" y="0" width="' + w + '" height="' + h + '" rx="' + w * 0.12 + '" fill="url(#s02_gCyl)"/>' +
              '<rect x="' + w * 0.24 + '" y="' + h * 0.1 + '" width="' + w * 0.05 + '" height="' + h * 0.8 + '" fill="url(#s02_gSpec)"/>' +
              '<rect x="' + w * 0.9 + '" y="' + h * 0.08 + '" width="' + w * 0.04 + '" height="' + h * 0.84 + '" fill="#ff8a3a" opacity="0.45"/>' +
              '<ellipse cx="' + w / 2 + '" cy="' + h * 0.03 + '" rx="' + w * 0.46 + '" ry="' + h * 0.025 + '" fill="url(#s02_gMetalH)"/>' +
              '</g>';
          }
          function bottle(x, base, w, h, kind) {
            var y = base - h;
            var d = 'M' + w * 0.38 + ',0 L' + w * 0.62 + ',0 L' + w * 0.62 + ',' + h * 0.1 +
              ' C' + w * 0.64 + ',' + h * 0.26 + ' ' + w + ',' + h * 0.3 + ' ' + w + ',' + h * 0.44 +
              ' L' + w + ',' + h * 0.97 + ' Q' + w + ',' + h + ' ' + w * 0.94 + ',' + h + ' L' + w * 0.06 + ',' + h +
              ' Q0,' + h + ' 0,' + h * 0.97 + ' L0,' + h * 0.44 + ' C0,' + h * 0.3 + ' ' + w * 0.36 + ',' + h * 0.26 + ' ' + w * 0.38 + ',' + h * 0.1 + ' Z';
            var glass = kind === 'g' ? 's02_gGreen' : 's02_gCola';
            var lab = kind === 'g' ? '#d8e85a' : '#b3121a';
            var cap = kind === 'g' ? '#2f8a2a' : '#c4161c';
            return '<g transform="translate(' + x + ',' + y + ')">' +
              '<path d="' + d + '" fill="url(#' + glass + ')"/>' +
              '<rect x="0" y="' + h * 0.56 + '" width="' + w + '" height="' + h * 0.17 + '" fill="' + lab + '" opacity="0.92"/>' +
              '<rect x="0" y="' + h * 0.63 + '" width="' + w + '" height="' + h * 0.02 + '" fill="#f4efe8" opacity="0.8"/>' +
              '<path d="' + d + '" fill="url(#s02_gCyl)"/>' +
              '<rect x="' + w * 0.36 + '" y="-' + h * 0.035 + '" width="' + w * 0.28 + '" height="' + h * 0.05 + '" rx="4" fill="' + cap + '"/>' +
              '<rect x="' + w * 0.18 + '" y="' + h * 0.42 + '" width="' + w * 0.05 + '" height="' + h * 0.52 + '" fill="url(#s02_gSpec)"/>' +
              '<rect x="' + w * 0.47 + '" y="' + h * 0.04 + '" width="' + w * 0.025 + '" height="' + h * 0.2 + '" fill="url(#s02_gSpec)" opacity="0.6"/>' +
              '<rect x="' + w * 0.9 + '" y="' + h * 0.45 + '" width="' + w * 0.04 + '" height="' + h * 0.5 + '" fill="#ff8a3a" opacity="0.4"/>' +
              '</g>';
          }
          function board(y) {
            var tags = '';
            for (var x = 60; x < 1520; x += 290) tags += '<rect x="' + (x + rnd() * 60) + '" y="' + (y + 10) + '" width="70" height="28" rx="3" fill="#e8a23a" opacity="0.85"/>';
            return '<rect x="0" y="' + (y - 14) + '" width="1560" height="14" fill="#1c2230"/>' +
              '<rect x="0" y="' + y + '" width="1560" height="48" fill="url(#s02_gBoard)"/>' +
              '<rect x="0" y="' + y + '" width="1560" height="2" fill="rgba(190,215,255,0.8)"/>' + tags +
              '<rect x="0" y="' + (y + 48) + '" width="1560" height="160" fill="url(#s02_gShadow)"/>';
          }
          var A = 560, B = 1130, C = 1700, g = '';
          g += '<rect x="0" y="-700" width="1560" height="2620" fill="url(#s02_gWall)"/>';
          // ceiling + fixtures
          g += '<rect x="0" y="-700" width="1560" height="420" fill="#05070c"/>';
          g += '<rect x="0" y="-300" width="1560" height="200" fill="url(#s02_gShadow)"/>';
          for (var i = 0; i < 6; i++) g += bottle(30 + i * 255, A, 200, 640, 'c');
          g += board(A);
          for (i = 0; i < 5; i++) g += redCan(25 + i * 300, B, 260, 470);
          g += board(B);
          g += redCan(-170, C, 250, 460) + bottle(130, C, 230, 580, 'g') + redCan(450, C, 250, 460) +
               redCan(840, C, 250, 460) + bottle(1170, C, 230, 580, 'g') + redCan(1440, C, 250, 460);
          g += board(C);
          g += '<rect x="0" y="' + (C + 48) + '" width="1560" height="400" fill="url(#s02_gFloor)"/>';
          var defs =
            '<linearGradient id="s02_gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070a12"/><stop offset="0.5" stop-color="#0d1322"/><stop offset="1" stop-color="#05070c"/></linearGradient>' +
            '<linearGradient id="s02_gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a0f14"/><stop offset="0.5" stop-color="#c8161d"/><stop offset="1" stop-color="#7a0a0e"/></linearGradient>' +
            '<linearGradient id="s02_gCola" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a140a"/><stop offset="0.5" stop-color="#1a0b05"/><stop offset="1" stop-color="#0c0503"/></linearGradient>' +
            '<linearGradient id="s02_gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f7a2a"/><stop offset="0.6" stop-color="#2fa03a"/><stop offset="1" stop-color="#0f4a18"/></linearGradient>' +
            '<linearGradient id="s02_gCyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity="0.8"/><stop offset="0.15" stop-color="#000" stop-opacity="0.3"/><stop offset="0.3" stop-color="#fff" stop-opacity="0.12"/><stop offset="0.45" stop-color="#000" stop-opacity="0.05"/><stop offset="0.8" stop-color="#000" stop-opacity="0.55"/><stop offset="1" stop-color="#000" stop-opacity="0.85"/></linearGradient>' +
            '<linearGradient id="s02_gSpec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.25" stop-color="#fff" stop-opacity="0.7"/><stop offset="0.75" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
            '<linearGradient id="s02_gMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a94a6"/><stop offset="0.5" stop-color="#dfe5ee"/><stop offset="1" stop-color="#6a7486"/></linearGradient>' +
            '<linearGradient id="s02_gMetalH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4250"/><stop offset="0.35" stop-color="#eef2f8"/><stop offset="1" stop-color="#2a303c"/></linearGradient>' +
            '<linearGradient id="s02_gBoard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4252"/><stop offset="0.4" stop-color="#1a1f2a"/><stop offset="1" stop-color="#0a0d14"/></linearGradient>' +
            '<linearGradient id="s02_gShadow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.85"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>' +
            '<linearGradient id="s02_gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121826"/><stop offset="1" stop-color="#020306"/></linearGradient>';
          $('s02_shelf').innerHTML = '<svg viewBox="0 -700 1560 2620" width="1560" height="2620"><defs>' + defs + '</defs>' + g + '</svg>';

          // foreground out-of-focus giants (near layer, heavy DOF blur)
          $('s02_fgL').innerHTML = '<svg viewBox="0 0 520 1300" width="520" height="1300"><defs>' + defs.replace(/id="s02_g/g, 'id="s02_f') + '</defs>' +
            bottle(0, 1300, 520, 1300, 'c').replace(/#s02_g/g, '#s02_f') + '</svg>';
          $('s02_fgR').innerHTML = '<svg viewBox="0 0 520 1100" width="520" height="1100"><defs>' + defs.replace(/id="s02_g/g, 'id="s02_h') + '</defs>' +
            redCan(0, 1100, 520, 1100).replace(/#s02_g/g, '#s02_h') + '</svg>';

          /* ---------- particles ---------- */
          function motes(host, n, rmin, rmax, blur, op) {
            var arr = [];
            for (var i = 0; i < n; i++) {
              var m = document.createElement('div'); m.className = 's02_mote';
              var r = rmin + rnd() * (rmax - rmin);
              m.style.width = m.style.height = (r * 2) + 'px';
              m.style.filter = 'blur(' + blur + 'px)';
              m.style.opacity = (op * (0.4 + rnd() * 0.6)).toFixed(2);
              host.appendChild(m);
              arr.push({ el: m, x: rnd() * 1080, y: rnd() * 1920, vx: (rnd() - 0.5) * 40, vy: 10 + rnd() * 50 });
            }
            return arr;
          }
          motes($('s02_motes'), 60, 1.5, 3.5, 0.4, 0.7).concat(motes($('s02_bokeh'), 10, 18, 44, 10, 0.3)).forEach(function (m) {
            tl.fromTo(m.el, { x: m.x, y: m.y }, { x: m.x + m.vx, y: m.y + m.vy, duration: D, ease: 'none' }, 0);
          });

          /* ================= TIMELINE ================= */
          var cam = $('s02_cam'), fg = $('s02_fg');
          // whip tilt down from the ceiling lights (motion blur + skew), lands on the wall of giants
          tl.fromTo(cam, { y: 620, scale: 1.08, skewY: 2.5, filter: 'blur(10px)' }, { y: 0, scale: 1.0, skewY: 0, filter: 'blur(0px)', duration: 0.85, ease: 'expo.out' }, 0);
          tl.fromTo(fg, { y: 900, scale: 1.1 }, { y: 0, scale: 1.0, duration: 0.85, ease: 'expo.out' }, 0);
          // slow push toward the small can (parallax: near layer grows faster)
