              '<path d="M110,0 L96,60 L118,120 L90,180 M214,0 L226,60 L204,120 L232,180" stroke="#ffb070" stroke-width="1.5" fill="none" />' + sil(160, 104, 0.5, PLANE, '#0c1430'),
            f1: '<rect width="320" height="180" fill="url(#s06_gTrack)" /><ellipse cx="70" cy="60" rx="50" ry="30" fill="#cfe0ff" opacity="0.25" /><ellipse cx="250" cy="56" rx="50" ry="30" fill="#cfe0ff" opacity="0.25" />' +
              '<rect x="0" y="80" width="320" height="2" fill="#ffd0a0" opacity="0.6" /><rect x="0" y="92" width="320" height="1.5" fill="#bcd4ff" opacity="0.5" />' +
              '<path d="M0,150 Q160,140 320,120" stroke="#b8222a" stroke-width="8" stroke-dasharray="12 12" fill="none" />' + sil(160, 128, 0.22, CAR, 'url(#s06_gCar)'),
            event: '<rect width="320" height="180" fill="url(#s06_gStage)" />' +
              '<path d="M100,0 L120,0 L180,150 L60,150 Z" fill="url(#s06_gBeamW)" opacity="0.6" /><path d="M200,0 L220,0 L280,150 L160,150 Z" fill="url(#s06_gBeamB)" opacity="0.6" /><path d="M150,0 L170,0 L240,150 L90,150 Z" fill="url(#s06_gBeamW)" opacity="0.35" />' +
              '<rect x="60" y="96" width="200" height="8" fill="#0a0610" /><rect x="60" y="92" width="200" height="3" fill="#ffc888" opacity="0.8" />' +
              '<path d="M0,180 L0,150 Q8,140 16,150 Q24,138 32,150 Q40,142 48,150 Q56,136 64,150 Q72,140 80,150 Q88,138 96,150 Q104,142 112,150 Q120,134 128,150 Q136,140 144,150 Q152,138 160,150 Q168,142 176,150 Q184,136 192,150 Q200,140 208,150 Q216,138 224,150 Q232,142 240,150 Q248,136 256,150 Q264,140 272,150 Q280,138 288,150 Q296,142 304,150 Q312,140 320,150 L320,180 Z" fill="#05030a" />' +
              '<path d="M60,150 L56,128 L64,128 Z M140,150 L136,124 L144,124 Z M230,150 L226,126 L234,126 Z" fill="#05030a" />',
            team: '<rect width="320" height="180" fill="url(#s06_gStudio)" /><path d="M140,0 L180,0 L260,180 L60,180 Z" fill="url(#s06_gBeamB)" opacity="0.3" />' +
              '<rect x="0" y="150" width="320" height="30" fill="#04070f" /><rect x="0" y="150" width="320" height="1.5" fill="#8ab4ff" opacity="0.6" />' +
              sil(80, 150, 0.9, PERSON, 'url(#s06_gSuit)') + sil(120, 150, 0.98, PERSON, 'url(#s06_gSuit)') + sil(160, 150, 1.05, PERSON, 'url(#s06_gSuit)') + sil(200, 150, 0.98, PERSON, 'url(#s06_gSuit)') + sil(240, 150, 0.9, PERSON, 'url(#s06_gSuit)'),
            prod: '<rect width="320" height="180" fill="url(#s06_gStudio)" /><rect x="220" y="20" width="70" height="60" fill="#e8eefa" opacity="0.8" /><rect x="214" y="14" width="82" height="72" fill="none" stroke="#0a1020" stroke-width="6" />' +
              '<path d="M220,80 L60,180 L320,180 L290,80 Z" fill="#cfe0ff" opacity="0.08" /><rect x="0" y="156" width="320" height="24" fill="#04070f" />' +
              sil(110, 156, 0.8, CAMRIG, '#06080f') + sil(60, 156, 0.95, PERSON, '#06080f') + sil(230, 156, 0.85, PERSON, 'url(#s06_gSuit)'),
            surf: '<rect width="320" height="180" fill="url(#s06_gSea)" /><circle cx="250" cy="44" r="30" fill="url(#s06_gSun)" />' +
              '<path d="M0,130 Q120,128 190,80 Q240,50 270,90 Q240,84 226,124 L320,132 L320,180 L0,180 Z" fill="#0c2a40" /><path d="M110,126 Q160,112 190,80 Q240,50 270,90" stroke="#e8f4ff" stroke-width="3" fill="none" />' +
              sil(180, 108, 0.5, PERSON, '#05070d'),
            sky: '<rect width="320" height="180" fill="url(#s06_gSky)" /><ellipse cx="90" cy="140" rx="120" ry="24" fill="#ffffff" opacity="0.5" /><ellipse cx="260" cy="150" rx="100" ry="20" fill="#ffffff" opacity="0.4" />' +
              '<g transform="translate(170,80) rotate(90) scale(0.7)"><path d="' + PERSON + '" fill="#0a1020" /><path d="M-14,-74 L-50,-60 L-50,-54 L-14,-66 Z M14,-74 L50,-60 L50,-54 L14,-66 Z" fill="#0a1020" /></g>'
          };
          var TYPES = ['moto', 'snow', 'plane', 'f1', 'event', 'team', 'prod', 'surf', 'sky'];

          var tcs = [];
          function screen(parent, x, y, w, h, type, opts) {
            opts = opts || {};
            var s = div('s06_scr', 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;' + (opts.css || ''), parent);
            var fs = Math.max(8, h * 0.075);
            var html = '<svg class="s06_feed" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice">' + FEEDS[type] + '</svg><div class="s06_scan"></div>';
            if (opts.live) html += '<div class="s06_live" style="font-size:' + fs.toFixed(1) + 'px"><span class="s06_rec"></span>LIVE</div>';
            else if (opts.cam) html += '<div class="s06_cam" style="font-size:' + fs.toFixed(1) + 'px;left:6%;right:auto">CAM ' + opts.cam + '</div>';
            if (opts.tc) html += '<div class="s06_tc" style="font-size:' + fs.toFixed(1) + 'px"></div>';
            s.innerHTML = html;
            if (opts.tc) tcs.push({ el: s.querySelector('.s06_tc'), off: Math.floor(r(0, 36000)) });
            return s;
          }
          function pan(scr, t0, dur) { F(scr.querySelector('.s06_feed'), { xPercent: 0 }, { xPercent: -9, duration: dur, ease: 'none' }, t0); }
          var recs = [];

          // ================= phase 1–2: control room (0 – 3.6) =================
          var wall1 = $('s06_wall1');
          var hero = screen(wall1, 300, 560, 480, 270, 'f1', { live: true, tc: true, css: 'box-shadow:0 0 60px rgba(90,150,255,0.5);border-color:#3a4c74' });
          pan(hero, 0, 3.6);
          var wallScreens = [];
          for (var row = 0; row < 8; row++) {
            for (var col = 0; col < 5; col++) {
              var x = -60 + col * 240, y = 290 + row * 140;
              if (x + 230 > 290 && x < 790 && y + 130 > 550 && y < 840) continue; // keep the hero slot clear
              if (y > 1250) continue;
              var t = TYPES[(row * 5 + col * 3) % TYPES.length];
              var sc = screen(wall1, x, y, 230, 130, t, { live: rnd() > 0.65, tc: rnd() > 0.5, cam: (row * 5 + col) % 9 + 1 });
              wallScreens.push(sc);
              pan(sc, 0, 3.6);
            }
          }
          // screens flicker on in a cascade out from the hero
          wallScreens.forEach(function (sc) {
            var dx = parseFloat(sc.style.left) + 115 - 540, dy = parseFloat(sc.style.top) + 65 - 695;
            var t = 0.25 + Math.sqrt(dx * dx + dy * dy) / 1100;
            F(sc, { opacity: 0.05 }, { opacity: 1, duration: 0.18, ease: 'steps(3)' }, t);
          });
          // console faders + blinking buttons
          (function () {
            var g = '';
            for (var i = 0; i < 16; i++) g += '<rect x="' + (260 + i * 36) + '" y="1418" width="20" height="26" rx="3" />';
            $('s06_faders').innerHTML = g;
            var p = $('s06_btns');
            var cols = ['#ff4a4a', '#4aff9a', '#6aa8ff', '#ffc04a'];
            for (var j = 0; j < 60; j++) {
              var c = cols[Math.floor(r(0, 4))];
              var b = div('s06_btn', 'left:' + r(240, 840).toFixed(0) + 'px;top:' + r(1455, 1530).toFixed(0) + 'px;background:' + c + ';box-shadow:0 0 8px ' + c + ';opacity:0.3', p);
              F(b, { opacity: 0.25 }, { opacity: 1, duration: r(0.15, 0.5), ease: 'steps(1)', yoyo: true, repeat: loops(3.6, 0.5) }, r(0, 0.5));
            }
          })();
          var roomCam = $('s06_roomCam');
          // start INSIDE the hero screen (the race we just left), pull back to reveal the room
          F(roomCam, { scale: 7.2, y: 265 }, { scale: 1.0, y: 0, duration: 2.6, ease: 'power3.out' }, 0);
          F(roomCam, { scale: 1.0, y: 0 }, { scale: 1.06, y: 10, duration: 0.4, ease: 'sine.inOut' }, 2.6);
          // ...then fly forward, straight through the screens
          F(roomCam, { scale: 1.06, y: 10, filter: 'blur(0px)' }, { scale: 9, y: 265, filter: 'blur(6px)', duration: 0.65, ease: 'power3.in' }, 3.0);
          F($('s06_wallGlow'), { opacity: 0.6 }, { opacity: 1, duration: 3, ease: 'sine.inOut' }, 0);
          F($('s06_beams'), { x: 0 }, { x: 120, duration: 3.6, ease: 'none' }, 0);
          F($('s06_haze'), { x: -80 }, { x: 120, duration: 3.6, ease: 'none' }, 0);
          F($('s06_op1'), { rotation: 0, svgOrigin: '220 1560' }, { rotation: -6, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0.6);
          F($('s06_op2'), { rotation: 0, svgOrigin: '830 1600' }, { rotation: 5, duration: 1.2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0.9);
          F($('s06_ops'), { y: 120 }, { y: 0, duration: 2.6, ease: 'power3.out' }, 0);

          var flash = $('s06_flash');
          F(flash, { opacity: 0 }, { opacity: 0.85, duration: 0.2, ease: 'power2.in' }, 3.45);
          F(flash, { opacity: 0.85 }, { opacity: 0, duration: 0.45, ease: 'power2.out' }, 3.65);
          tl.set($('s06_room'), { opacity: 0 }, 3.65);
          tl.set($('s06_tunnel'), { opacity: 1 }, 3.65);

          // ================= phase 3: tunnel of screens (3.65 – 7.4) =================
          var T = 2.0, N = 5, TUN0 = 3.65, TUN1 = 7.5;
          for (var i = 0; i < N; i++) {
            var ring = div('s06_ring', '', $('s06_rings'));
            var tw = 360, th = 203;
            for (var cx = 0; cx < 3; cx++) {
              screen(ring, cx * 360, 0, tw - 8, th - 8, TYPES[(i + cx) % 9], { live: cx === 1, tc: cx !== 1 });
              screen(ring, cx * 360, 1920 - th, tw - 8, th - 8, TYPES[(i + cx + 4) % 9], { live: cx === 0, tc: true });
            }
            for (var cy = 1; cy < 9; cy++) {
              screen(ring, 0, cy * th, tw - 8, th - 8, TYPES[(i * 2 + cy) % 9], { live: cy % 3 === 0, tc: cy % 2 === 0 });
              screen(ring, 1080 - tw, cy * th, tw - 8, th - 8, TYPES[(i * 2 + cy + 5) % 9], { live: cy % 4 === 1, tc: cy % 2 === 1 });
            }
            var start = TUN0 - (i + 1) * T / N + 0.4;
            var rt = gsap.timeline({ repeat: Math.max(0, Math.floor((TUN1 - start) / T) - 0) });
            rt.fromTo(ring, { scale: 0.06 }, { scale: 2.4, duration: T, ease: 'power3.in' }, 0);
            rt.fromTo(ring, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'none' }, 0);
            rt.fromTo(ring, { filter: 'brightness(0.35)' }, { filter: 'brightness(1.1)', duration: T, ease: 'power2.in' }, 0);
            tl.add(rt, start);
          }
          F($('s06_core'), { scale: 0.8, opacity: 0.7 }, { scale: 1.3, opacity: 1, duration: 0.35, ease: 'sine.inOut', yoyo: true, repeat: loops(TUN1 - TUN0, 0.35) }, TUN0);
          // feature cards fly out of the vanishing point: events (≈"eventos"), then teams (≈"equipos")
          function card(type, t0, t1) {
            var c = screen($('s06_cards'), 160, 746, 760, 428, type, { live: true, tc: true });
            c.className += ' s06_card';
            c.style.left = '160px'; c.style.top = '746px';
            pan(c, t0, t1 - t0 + 0.4);
            F(c, { scale: 0.04, opacity: 0, rotation: -4 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.65, ease: 'power3.out' }, t0);
            F(c, { scale: 1 }, { scale: 1.12, duration: t1 - t0 - 0.65, ease: 'none' }, t0 + 0.65);
            F(c, { scale: 1.12, opacity: 1 }, { scale: 3.6, opacity: 0, duration: 0.35, ease: 'power2.in' }, t1);
            return c;
          }
          card('event', 4.45, 5.75);
          card('team', 5.8, 7.1);

          // ================= phase 4: the vast wall (7.45 – 9.8) =================
          F(flash, { opacity: 0 }, { opacity: 0.7, duration: 0.15, ease: 'power2.in' }, 7.3);
          F(flash, { opacity: 0.7 }, { opacity: 0, duration: 0.5, ease: 'power2.out' }, 7.45);
          tl.set($('s06_tunnel'), { opacity: 0 }, 7.45);
          tl.set($('s06_vast'), { opacity: 1 }, 7.45);
          (function () {
            var w2 = $('s06_wall2'), pw = 188, ph = 109, C = 13, R = 19;
            var x0 = 540 - (C * pw) / 2, y0 = 960 - (R * ph) / 2;
            for (var rr = 0; rr < R; rr++) {
              for (var cc = 0; cc < C; cc++) {
                var center = rr === 9 && cc === 6;
                var t = center ? 'prod' : TYPES[(rr * 7 + cc * 5) % 9];
                var sc = screen(w2, Math.round(x0 + cc * pw), Math.round(y0 + rr * ph), pw - 8, ph - 8, t, { live: center || rnd() > 0.7, tc: center || rnd() > 0.55 });
                if (center || rnd() > 0.5) pan(sc, 7.45, 2.35);
                var dx = cc - 6, dy = rr - 9;
                // the wall lights up outward from the centre screen
                F(sc, { opacity: center ? 1 : 0.08 }, { opacity: 1, duration: 0.15, ease: 'steps(2)' }, 7.5 + Math.sqrt(dx * dx + dy * dy) * 0.12);
              }
            }
          })();
          var vastCam = $('s06_vastCam');
          F(vastCam, { scale: 5.6, rotation: 0 }, { scale: 0.93, rotation: -1.2, duration: 2.35, ease: 'power3.inOut' }, 7.45);
          F($('s06_rig'), { x: -420, opacity: 0 }, { x: 0, opacity: 1, duration: 1.6, ease: 'power2.out' }, 8.1);
          F($('s06_tally'), { opacity: 1 }, { opacity: 0.2, duration: 0.3, ease: 'steps(1)', yoyo: true, repeat: loops(1.6, 0.3) }, 8.1);

          // ---------- every LIVE dot pulses, every timecode runs ----------
          root.querySelectorAll('.s06_rec').forEach(function (d, i) {
            F(d, { opacity: 1 }, { opacity: 0.25, duration: 0.5, ease: 'steps(1)', yoyo: true, repeat: loops(D, 0.5) }, (i % 4) * 0.12);
          });
          function pad(n) { return (n < 10 ? '0' : '') + n; }
          var clock = { t: 0 };
          tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: 'none', onUpdate: function () {
            var f = Math.floor(clock.t * 30);
            for (var k = 0; k < tcs.length; k++) {
              var fr = tcs[k].off * 30 + 54000 * 30 + f; // starts around 15:00:00
              var ff = fr % 30, s = Math.floor(fr / 30);
              tcs[k].el.textContent = pad(Math.floor(s / 3600) % 24) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60) + ':' + pad(ff);
            }
          } }, 0);

          // ---------- drifting light motes over everything ----------
          (function () {
            var p = $('s06_motes');
            for (var i = 0; i < 40; i++) {
              var s = r(2, i < 5 ? 14 : 5);
              var d = div('s06_dot', 'left:' + r(0, 1080).toFixed(0) + 'px;top:' + r(0, 1920).toFixed(0) + 'px;width:' + s.toFixed(1) + 'px;height:' + s.toFixed(1) + 'px;background:#bcd4ff;opacity:' + r(0.15, 0.5).toFixed(2) + ';filter:blur(' + (s * 0.3).toFixed(1) + 'px)', p);
              F(d, { x: 0, y: 0 }, { x: r(-100, 100), y: -r(150, 450), duration: D, ease: 'none' }, 0);
            }
          })();

          window.__timelines['s06'] = tl;
          tl.seek(0);
        })();
      </script>
