<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: 'Inter'; font-weight: 300; src: url('assets/fonts/inter-300.ttf'); }
        @font-face { font-family: 'Inter'; font-weight: 600; src: url('assets/fonts/inter-600.ttf'); }
        [data-composition-id="s10"] #stage {
          position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden;
          background: radial-gradient(ellipse at 50% 55%, #070b16 0%, #020308 55%, #000 100%);
        }
        [data-composition-id="s10"] #stage * { box-sizing: border-box; margin: 0; padding: 0; }
        [data-composition-id="s10"] #stage .s10_layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        [data-composition-id="s10"] #stage .s10_layer svg { position: absolute; left: 0; top: 0; }
        [data-composition-id="s10"] #stage #s10_world { transform-origin: 540px 1210px; transform: scale(1.6); }
        [data-composition-id="s10"] #stage #s10_far { opacity: 0; transform-origin: 540px 1210px; }
        [data-composition-id="s10"] #stage #s10_hline {
          position: absolute; left: 0; top: 1236px; width: 1080px; height: 28px; opacity: 0; transform: scaleX(0); mix-blend-mode: screen;
          background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,236,210,0.95), rgba(255,160,90,0.45) 30%, rgba(120,170,255,0.12) 65%, transparent 80%);
        }
        [data-composition-id="s10"] #stage #s10_rays {
          opacity: 0; mix-blend-mode: screen; filter: blur(16px); transform-origin: 540px 1250px;
          background: repeating-conic-gradient(from 270deg at 540px 1250px, rgba(255,190,130,0) 0deg 5deg, rgba(255,200,150,0.16) 7deg 8deg, rgba(170,200,255,0) 10deg 13deg, rgba(170,200,255,0.12) 14deg 15deg, rgba(255,190,130,0) 17deg 20deg);
          -webkit-mask-image: radial-gradient(ellipse 70% 40% at 540px 1250px, #000 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
          mask-image: radial-gradient(ellipse 70% 40% at 540px 1250px, #000 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
        }
        [data-composition-id="s10"] #stage #s10_mtn { opacity: 0; transform: translateY(260px); }
        [data-composition-id="s10"] #stage #s10_mid { opacity: 0; transform-origin: 540px 1300px; }
        [data-composition-id="s10"] #stage #s10_floor { opacity: 0; }
        [data-composition-id="s10"] #stage #s10_air { opacity: 0; }
        [data-composition-id="s10"] #stage #s10_near { filter: blur(5px); transform-origin: 540px 1920px; transform: translateY(600px); }
        [data-composition-id="s10"] #stage #s10_spot {
          mix-blend-mode: screen; filter: blur(20px); opacity: 0;
          background: conic-gradient(from 168deg at 50% -6%, transparent 0deg, rgba(160,190,255,0.26) 8deg, rgba(205,222,255,0.36) 12deg, rgba(160,190,255,0.26) 16deg, transparent 24deg);
        }
        [data-composition-id="s10"] #stage .s10_haze { position: absolute; border-radius: 50%; filter: blur(70px); mix-blend-mode: screen; }
        [data-composition-id="s10"] #stage #s10_canwrap { position: absolute; left: 340px; top: 360px; width: 400px; height: 1200px; transform-origin: 200px 600px; transform: scale(0.62); }
        [data-composition-id="s10"] #stage #s10_pool {
          position: absolute; left: -300px; top: 1100px; width: 1000px; height: 200px; border-radius: 50%;
          background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(170,200,255,0.30), rgba(90,130,230,0.10) 50%, transparent 72%);
        }
        [data-composition-id="s10"] #stage #s10_canglow {
          position: absolute; left: -500px; top: -300px; width: 1400px; height: 1800px; mix-blend-mode: screen; opacity: 0.35;
          background: radial-gradient(ellipse 30% 40% at 50% 50%, rgba(255,170,90,0.35), rgba(90,130,230,0.12) 50%, transparent 72%);
        }
        [data-composition-id="s10"] #stage #s10_parts { mix-blend-mode: screen; }
        [data-composition-id="s10"] #stage .s10_p { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(225,235,255,0.9), rgba(160,190,255,0.25) 45%, transparent 70%); }
        [data-composition-id="s10"] #stage .s10_w { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,240,220,0.95), rgba(255,170,100,0.3) 45%, transparent 70%); opacity: 0; }
        [data-composition-id="s10"] #stage #s10_flash { position: absolute; inset: 0; opacity: 0.92; background: radial-gradient(ellipse at 50% 50%, #fff6e8 0%, #ffd9aa 40%, #c8d6ff 100%); }
        [data-composition-id="s10"] #stage #s10_bars { position: absolute; inset: 0; pointer-events: none;
          background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 12%, transparent 88%, rgba(0,0,0,0.6) 100%); }
        [data-composition-id="s10"] #stage #s10_black { position: absolute; inset: 0; background: #000; opacity: 0; }
      </style>

      <div id="stage" data-composition-id="s10" data-duration="22" data-width="1080" data-height="1920" style="width:1080px;height:1920px">
        <div id="s10_world" class="s10_layer">
          <div id="s10_far" class="s10_layer"></div>
          <div id="s10_air" class="s10_layer"></div>
          <div id="s10_rays" class="s10_layer"></div>
          <div id="s10_mtn" class="s10_layer"></div>
          <div id="s10_hline"></div>
          <div id="s10_mid" class="s10_layer"></div>
          <div id="s10_floor" class="s10_layer"></div>
        </div>
        <div id="s10_hazeL" class="s10_layer">
          <div class="s10_haze" style="left:-260px;top:900px;width:1000px;height:520px;background:rgba(90,130,230,0.14)"></div>
          <div class="s10_haze" style="left:420px;top:1150px;width:900px;height:440px;background:rgba(255,140,70,0.08)"></div>
        </div>
        <div id="s10_spot" class="s10_layer"></div>
        <div id="s10_canwrap"><div id="s10_canglow"></div><div id="s10_pool"></div><div id="s10_can"></div></div>
        <div id="s10_near" class="s10_layer"></div>
        <div id="s10_parts" class="s10_layer"></div>
        <div id="s10_bars"></div>
        <div id="s10_flash"></div>
        <div id="s10_black"></div>
      </div>

      <script>
        (function () {
          var root = document.querySelector('[data-composition-id="s10"]');
          var $ = function (id) { return root.querySelector('#' + id); };
          var tl = gsap.timeline({ paused: true });
          var D = 22;
          var seed = 1010;
          function rnd() { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; var t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
          function f(n) { return n.toFixed(1); }
          var hump = function (p) { return Math.sin(Math.PI * p); };

          /* ---------- the can (same design as s01/s07) ---------- */
          function makeCan(p) {
            var P = 360, content = '';
            for (var k = -1; k <= 2; k++) {
              var x0 = k * P;
              content += '<rect x="' + x0 + '" y="0" width="180" height="600" fill="url(#' + p + 'blue)"/>' +
                '<rect x="' + (x0 + 180) + '" y="0" width="180" height="600" fill="url(#' + p + 'silv)"/>' +
                '<circle cx="' + (x0 + 90) + '" cy="300" r="52" fill="url(#' + p + 'sun)"/>' +
                '<circle cx="' + (x0 + 90) + '" cy="300" r="64" fill="none" stroke="rgba(255,190,110,0.35)" stroke-width="2"/>' +
                '<rect x="' + (x0 + 196) + '" y="210" width="148" height="10" fill="#1a3a8a" opacity="0.8"/>' +
                '<rect x="' + (x0 + 196) + '" y="380" width="148" height="10" fill="#1a3a8a" opacity="0.8"/>' +
                '<rect x="' + (x0 - 12) + '" y="0" width="24" height="600" fill="url(#' + p + 'chk)"/>' +
                '<rect x="' + (x0 + 168) + '" y="0" width="24" height="600" fill="url(#' + p + 'chk)"/>';
            }
            var drops = '';
            for (var i = 0; i < 60; i++) {
              var dx = 18 + rnd() * 164, dy = 90 + rnd() * 460, r = 1.2 + rnd() * rnd() * 5;
              drops += '<circle cx="' + f(dx) + '" cy="' + f(dy) + '" r="' + r.toFixed(2) + '" fill="rgba(200,225,255,0.16)" stroke="rgba(230,240,255,0.35)" stroke-width="0.5"/>' +
                '<circle cx="' + f(dx - r * 0.35) + '" cy="' + f(dy - r * 0.35) + '" r="' + (r * 0.3).toFixed(2) + '" fill="rgba(255,255,255,0.85)"/>';
            }
            var body = 'M10,82 Q10,62 26,52 L30,46 L170,46 L174,52 Q190,62 190,82 L190,548 Q190,566 176,576 L170,584 L30,584 L24,576 Q10,566 10,548 Z';
            return '<svg viewBox="0 0 200 600" width="400" height="1200" style="position:absolute;left:0;top:0">' +
              '<defs>' +
              '<linearGradient id="' + p + 'blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1f5c"/><stop offset="0.5" stop-color="#1238a0"/><stop offset="1" stop-color="#081845"/></linearGradient>' +
              '<linearGradient id="' + p + 'silv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa6b8"/><stop offset="0.5" stop-color="#e6ebf2"/><stop offset="1" stop-color="#8794a8"/></linearGradient>' +
              '<radialGradient id="' + p + 'sun"><stop offset="0" stop-color="#fff2c0"/><stop offset="0.45" stop-color="#ffb347"/><stop offset="0.85" stop-color="#e8562a"/><stop offset="1" stop-color="#b8321a"/></radialGradient>' +
              '<pattern id="' + p + 'chk" patternUnits="userSpaceOnUse" width="24" height="24"><rect width="24" height="24" fill="#c8d0dc"/><polygon points="12,0 24,12 12,24 0,12" fill="#10308a"/></pattern>' +
              '<linearGradient id="' + p + 'shade" x1="0" y1="0" x2="1" y2="0">' +
              '<stop offset="0" stop-color="#000" stop-opacity="0.85"/><stop offset="0.12" stop-color="#000" stop-opacity="0.35"/><stop offset="0.3" stop-color="#000" stop-opacity="0"/>' +
              '<stop offset="0.55" stop-color="#000" stop-opacity="0.12"/><stop offset="0.82" stop-color="#000" stop-opacity="0.6"/><stop offset="1" stop-color="#000" stop-opacity="0.9"/></linearGradient>' +
              '<linearGradient id="' + p + 'rimW" x1="0" y1="0" x2="1" y2="0"><stop offset="0.86" stop-color="#ff8a3a" stop-opacity="0"/><stop offset="0.95" stop-color="#ff9a4a" stop-opacity="0.75"/><stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/></linearGradient>' +
              '<linearGradient id="' + p + 'rimC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8fb8ff" stop-opacity="0"/><stop offset="0.04" stop-color="#9cc2ff" stop-opacity="0.6"/><stop offset="0.12" stop-color="#8fb8ff" stop-opacity="0"/></linearGradient>' +
              '<linearGradient id="' + p + 'spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.2" stop-color="#fff" stop-opacity="0.85"/><stop offset="0.8" stop-color="#fff" stop-opacity="0.75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
              '<linearGradient id="' + p + 'lid" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4250"/><stop offset="0.3" stop-color="#f2f5fa"/><stop offset="0.6" stop-color="#9aa4b4"/><stop offset="1" stop-color="#2a303c"/></linearGradient>' +
              '<clipPath id="' + p + 'clip"><path d="' + body + '"/></clipPath>' +
              '<filter id="' + p + 'soft" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>' +
              '</defs>' +
              '<g clip-path="url(#' + p + 'clip)">' +
              '<g id="' + p + 'label">' + content + '</g>' +
              '<rect x="0" y="40" width="200" height="56" fill="url(#' + p + 'lid)" opacity="0.92"/>' +
              '<rect x="0" y="540" width="200" height="50" fill="url(#' + p + 'lid)" opacity="0.92"/>' +
              '<rect x="0" y="0" width="200" height="600" fill="url(#' + p + 'shade)"/>' +
              '<rect x="0" y="0" width="200" height="600" fill="url(#' + p + 'rimW)"/>' +
              '<rect x="0" y="0" width="200" height="600" fill="url(#' + p + 'rimC)"/>' +
              '<rect x="40" y="40" width="40" height="560" fill="#fff" opacity="0.18" filter="url(#' + p + 'soft)"/>' +
              '<rect id="' + p + 'spec1" x="54" y="60" width="9" height="520" fill="url(#' + p + 'spec)"/>' +
              '<rect x="150" y="80" width="4" height="470" fill="url(#' + p + 'spec)" opacity="0.35"/>' +
              '<g>' + drops + '</g>' +
              '</g>' +
              '<ellipse cx="100" cy="46" rx="70" ry="9" fill="url(#' + p + 'lid)"/>' +
              '<ellipse cx="100" cy="46" rx="58" ry="6" fill="#4a5262"/>' +
              '<ellipse cx="96" cy="45" rx="14" ry="3" fill="#c9d1dd"/>' +
              '</svg>';
          }
          $('s10_can').innerHTML = makeCan('s10_c');
          var label = $('s10_can').querySelector('#s10_clabel');

          function svg(inner, defs) {
            return '<svg viewBox="0 0 1080 1920" width="1080" height="1920"><defs>' + (defs || '') + '</defs>' + inner + '</svg>';
          }
          function ridge(y0, amp, step) {
            var d = 'M-300,' + y0, x = -300;
            while (x < 1380) { x += step * (0.6 + rnd() * 0.8); d += ' L' + f(x) + ',' + f(y0 - rnd() * amp); }
            return d + ' L1380,1920 L-300,1920 Z';
          }

          /* ---------- FAR: sky (calm centre band 700-1000), stars kept high, warm horizon glow ---------- */
          var stars = '';
          for (var i = 0; i < 110; i++) stars += '<circle class="s10_star" cx="' + f(rnd() * 1080) + '" cy="' + f(rnd() * 620) + '" r="' + (0.6 + rnd() * 1.5).toFixed(2) + '" fill="#dfe8ff" opacity="' + (0.2 + rnd() * 0.6).toFixed(2) + '"/>';
          $('s10_far').innerHTML = svg('<rect width="1080" height="1920" fill="url(#s10_gSky)"/>' + stars + '<ellipse cx="540" cy="1250" rx="700" ry="300" fill="url(#s10_gSun)"/>',
            '<linearGradient id="s10_gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#010209"/><stop offset="0.3" stop-color="#06102a"/><stop offset="0.52" stop-color="#11214a"/><stop offset="0.63" stop-color="#3a2c4a"/><stop offset="0.66" stop-color="#0c0b14"/><stop offset="1" stop-color="#030408"/></linearGradient>' +
            '<radialGradient id="s10_gSun"><stop offset="0" stop-color="#ffd9a0" stop-opacity="0.6"/><stop offset="0.35" stop-color="#ff8a40" stop-opacity="0.22"/><stop offset="1" stop-color="#ff6a20" stop-opacity="0"/></radialGradient>');
          /* ---------- MOUNTAINS behind the horizon ---------- */
          $('s10_mtn').innerHTML = svg(
            '<path d="' + ridge(1250, 210, 80) + '" fill="url(#s10_gM1)" stroke="rgba(160,195,255,0.55)" stroke-width="2"/>' +
            '<path d="' + ridge(1262, 110, 55) + '" fill="url(#s10_gM2)" stroke="rgba(255,150,80,0.6)" stroke-width="2"/>',
            '<linearGradient id="s10_gM1" x1="0" y1="0" x2="0" y2="1"><stop offset="0.55" stop-color="#2c4478"/><stop offset="0.62" stop-color="#0c1530"/><stop offset="0.7" stop-color="#05080f"/></linearGradient>' +
            '<linearGradient id="s10_gM2" x1="0" y1="0" x2="0" y2="1"><stop offset="0.6" stop-color="#1a1e34"/><stop offset="0.7" stop-color="#05070c"/></linearGradient>');
          /* ---------- AIR: aircraft with contrails high in the sky ---------- */
          function jet(id, s) {
            return '<g id="' + id + '"><g transform="scale(' + s + ')"><rect x="-620" y="-2" width="560" height="4" fill="url(#s10_gTrail)"/>' +
              '<path d="M0,0 L-50,-3 L-64,-18 L-57,-18 L-36,-4 L-14,-3 L-42,-34 L-31,-34 L7,-3 Q26,-1 29,0 Q26,1 7,3 L-31,34 L-42,34 L-14,3 L-36,4 L-57,18 L-64,18 L-50,3 Z" fill="#05070e" stroke="rgba(170,200,255,0.75)" stroke-width="1.2"/></g></g>';
          }
          $('s10_air').innerHTML = svg(jet('s10_j1', 0.9) + jet('s10_j2', 0.6),
            '<linearGradient id="s10_gTrail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfe0ff" stop-opacity="0"/><stop offset="1" stop-color="#cfe0ff" stop-opacity="0.7"/></linearGradient>');
          /* ---------- MID: stadium bowl, floodlight towers, event lights on the plain ---------- */
          var cx = 540, cy = 1300, bowl = '', crowd = '', towers = '', city = '';
          for (var r = 0; r < 5; r++) {
            var rx = 330 + r * 30, ry = 60 + r * 10;
            bowl += '<path d="M' + (cx - rx) + ',' + cy + ' A' + rx + ',' + ry + ' 0 0 1 ' + (cx + rx) + ',' + cy + '" fill="none" stroke="' + (r % 2 ? '#0c1324' : '#111a30') + '" stroke-width="22"/>';
            for (var a = 0; a < 40; a++) {
              var th = Math.PI * (a + rnd() * 0.8) / 40, x = cx + rx * Math.cos(th), y = cy - ry * Math.sin(th);
              crowd += '<circle class="s10_cd" cx="' + f(x) + '" cy="' + f(y) + '" r="' + (1.2 + rnd() * 1.4).toFixed(1) + '" fill="' + (rnd() < 0.5 ? 'rgba(255,190,130,' : 'rgba(170,200,255,') + (0.3 + rnd() * 0.5).toFixed(2) + ')"/>';
            }
          }
          [[110, 1300, 1090], [970, 1300, 1090], [250, 1290, 1130], [830, 1290, 1130]].forEach(function (t, k) {
            towers += '<rect x="' + (t[0] - 4) + '" y="' + t[2] + '" width="8" height="' + (t[1] - t[2]) + '" fill="#04060c" stroke="rgba(140,170,230,0.35)"/>' +
              '<rect x="' + (t[0] - 28) + '" y="' + (t[2] - 22) + '" width="56" height="24" rx="4" fill="#e6efff"/>' +
              '<circle class="s10_lamp" cx="' + t[0] + '" cy="' + (t[2] - 10) + '" r="100" fill="url(#s10_gLamp)" opacity="0"/>' +
              '<path d="M' + (t[0] - 24) + ',' + t[2] + ' L' + (380 + k * 100) + ',1330 L' + (460 + k * 100) + ',1330 Z" fill="url(#s10_gCone)" opacity="0.25"/>';
          });
          for (var i = 0; i < 70; i++) city += '<circle class="s10_ct" cx="' + f(rnd() * 1080) + '" cy="' + f(1262 + rnd() * 40) + '" r="' + (0.8 + rnd() * 1.6).toFixed(1) + '" fill="' + (rnd() < 0.6 ? '#ffc890' : '#cfe0ff') + '" opacity="0"/>';
          $('s10_mid').innerHTML = svg(city + '<ellipse cx="540" cy="1310" rx="420" ry="90" fill="url(#s10_gBowl)"/>' + bowl + crowd + towers,
            '<radialGradient id="s10_gBowl" cx="0.5" cy="0.3"><stop offset="0.5" stop-color="#0a1020"/><stop offset="1" stop-color="#03050a" stop-opacity="0"/></radialGradient>' +
            '<radialGradient id="s10_gLamp"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="0.18" stop-color="#cfe0ff" stop-opacity="0.5"/><stop offset="1" stop-color="#8fb0ff" stop-opacity="0"/></radialGradient>' +
            '<linearGradient id="s10_gCone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe0ff" stop-opacity="0.8"/><stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/></linearGradient>');
          /* ---------- FLOOR: plinth under the can + racing circuit with light trails ---------- */
          var track = 'M540,1330 C860,1330 1040,1380 1040,1440 C1040,1500 860,1550 540,1550 C220,1550 40,1500 40,1440 C40,1380 220,1330 540,1330 Z';
          $('s10_floor').innerHTML = svg(
            '<rect x="0" y="1300" width="1080" height="620" fill="url(#s10_gGround)"/>' +
            '<path d="' + track + '" fill="none" stroke="#0b0f1a" stroke-width="36"/>' +
            '<path d="' + track + '" fill="none" stroke="url(#s10_gKerb)" stroke-width="40" stroke-dasharray="10 10" opacity="0.3"/>' +
            '<path d="' + track + '" fill="none" stroke="#090d17" stroke-width="32"/>' +
            '<path id="s10_trA" d="' + track + '" fill="none" stroke="#ff5a2a" stroke-width="4" stroke-dasharray="180 1500" filter="url(#s10_glow)"/>' +
            '<path id="s10_trB" d="' + track + '" fill="none" stroke="#e8f0ff" stroke-width="3" stroke-dasharray="140 1540" filter="url(#s10_glow)"/>' +
            '<ellipse id="s10_ring" cx="540" cy="1306" rx="120" ry="22" fill="none" stroke="rgba(140,180,255,0.5)" stroke-width="2"/>' +
            '<ellipse cx="540" cy="1310" rx="56" ry="12" fill="url(#s10_gTop)"/>' +
            '<ellipse cx="540" cy="1306" rx="52" ry="9" fill="url(#s10_gTop2)" stroke="rgba(190,210,255,0.6)" stroke-width="0.6"/>',
            '<linearGradient id="s10_gGround" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080b14" stop-opacity="0"/><stop offset="0.1" stop-color="#05070d"/><stop offset="1" stop-color="#020306"/></linearGradient>' +
            '<linearGradient id="s10_gKerb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3a2a"/><stop offset="1" stop-color="#e8f0ff"/></linearGradient>' +
            '<radialGradient id="s10_gTop" cx="0.5" cy="0.4"><stop offset="0" stop-color="#2a3550"/><stop offset="1" stop-color="#05070d"/></radialGradient>' +
            '<radialGradient id="s10_gTop2" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#3a4a70"/><stop offset="0.5" stop-color="#141c30"/><stop offset="0.9" stop-color="#0a0f1c"/><stop offset="1" stop-color="#ff9a5a"/></radialGradient>' +
            '<filter id="s10_glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>');
          /* ---------- NEAR: audience silhouettes (out of focus), phone lights ---------- */
          var aud = '';
          for (var row = 0; row < 3; row++) {
